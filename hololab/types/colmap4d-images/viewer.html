<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4D image video preview</title>
<style>
:root { color-scheme: dark; font: 12px system-ui,sans-serif; color: #ddd; background: #171717; }
* { box-sizing: border-box; }
body { margin: 0; display: flex; flex-direction: column; height: 100vh; }
#stage { flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; background: #111; position: relative; }
#stage video { width: 100%; height: 100%; object-fit: contain; position: absolute; }
[hidden] { display: none !important; }
#partitions { padding: 6px 8px; display: flex; gap: 8px; align-items: center; font: 11px ui-monospace,monospace; }
#partitions button { min-width: 22px; height: 20px; padding: 0; }
#partition-label { flex: 1; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#status { z-index: 1; background: #171717dd; padding: 4px; }
#cameras { padding: 6px 8px; }
button, select, input { accent-color: #aaa; color: inherit; background: #292929; border: 1px solid #555; border-radius: 3px; }
button, select { padding: 4px 8px; } button { min-width: 54px; }

label { display: inline-flex; gap: 4px; align-items: center; }
</style>
<nav id="partitions" aria-label="Fan-out partitions" hidden><button id="previous" aria-label="previous element">‹</button><span id="partition-label"></span><button id="next" aria-label="next element">›</button></nav>
<div id="stage"><video id="video" controls muted playsinline loop preload="auto"></video><span id="status" role="status">Waiting for sequence…</span></div>
<div id="cameras" hidden><label>Camera <select id="camera" aria-label="Camera"></select></label></div>
<script type="module">
import {safeName, readImages, readTimes, legacyImages, groupImages, partitions} from './sequence.js';
import {synthesize, thumbnailUrl} from './preview-video.js';
import {PreviewCache} from './preview-cache.js';
const $ = id => document.getElementById(id);
const video = $('video'), status = $('status'), camera = $('camera'), pager = $('partitions');
const cache = new PreviewCache();
let base = '', members = [], page = 0, preferred = '', currentKey = '', generation = 0;
let listingController, viewController, task, objectUrl, warmTimer, resume = false;
const urlFor = (root, name) => root + '/' + name.split('/').map(encodeURIComponent).join('/');
const pageRoot = n => members.length ? urlFor(base, members[n]) : base;
function metrics() {
  pager.dataset.cached = String(cache.entries.size); pager.dataset.cacheBytes = String(cache.bytes);
}
function message(text) { status.hidden = false; status.textContent = text; }
function clearVideo() {
  viewController?.abort(); viewController = new AbortController();
  video.pause(); video.removeAttribute('src'); video.load();
  if (objectUrl) URL.revokeObjectURL(objectUrl);
  objectUrl = null;
}
async function listing(root, pattern, signal) {
  const parts = new URL(root, location.origin).pathname.split('/').filter(Boolean);
  const query = new URLSearchParams({base: parts.slice(2).map(decodeURIComponent).join('/'), pattern});
  const response = await fetch(`/proxy/${parts[1]}/_glob?${query}`, {signal, cache: 'no-store'});
  if (!response.ok) throw Error(`Directory listing: HTTP ${response.status}`);
  const {files} = await response.json();
  if (!Array.isArray(files)) throw Error('Invalid directory listing');
  return files.filter(safeName);
}
async function binary(root, name, signal) {
  const response = await fetch(urlFor(root, name), {signal, cache: 'no-store'});
  if (!response.ok) throw Error(`${name}: HTTP ${response.status}`);
  return response.arrayBuffer();
}
async function prepare(root, wanted, signal, progress) {
  const files = await listing(root, '*', signal);
  let records, times;
  if (files.includes('images.bin')) {
    const buffers = await Promise.all([binary(root, 'images.bin', signal),
      files.includes('times.bin') ? binary(root, 'times.bin', signal) : null]);
    records = readImages(buffers[0]); times = buffers[1] ? readTimes(buffers[1]) : new Map();
  } else records = legacyImages([...files, ...await listing(root, 'images/*', signal)]);
  signal.throwIfAborted();
  const groups = groupImages(records, times);
  const cameras = [...groups.keys()].sort((a,b) => a.localeCompare(b, 'en', {numeric: true}));
  if (!cameras.length) throw Error('No preview images found in this sequence');
  const selected = groups.has(wanted) ? wanted : groups.has('cam0') ? 'cam0' : cameras[0];
  if (!video.canPlayType('video/webm; codecs="vp8"')) throw Error('This browser does not support VP8/WebM previews');
  const blob = await synthesize(groups.get(selected), name => thumbnailUrl(root, name), 30, signal,
    progress, name => urlFor(root, name));
  return {root, camera: selected, cameras, blob};
}
function acquire(root, wanted) {
  if (task && task.root === root && task.wanted === wanted) return task.promise;
  task?.controller.abort();
  const controller = new AbortController(), work = {root, wanted, controller};
  work.promise = prepare(root, wanted, controller.signal, (done, total) => {
    if (!controller.signal.aborted && root === pageRoot(page) && !objectUrl) message(`Preparing video ${done} / ${total}…`);
  }).then(entry => {
    controller.signal.throwIfAborted(); cache.put(entry, currentKey); metrics(); return entry;
  }).finally(() => { if (task === work) task = null; });
  task = work; return work.promise;
}
async function warm(version) {
  if (members.length < 2) return;
  // One background encoder, next page first. Never prewarm all six shards.
  for (const delta of [1, -1]) {
    if (version !== generation) return;
    const root = pageRoot((page + delta + members.length) % members.length);
    if (cache.get(root, preferred)) continue;
    try { await acquire(root, preferred); }
    catch { if (version !== generation) return; /* A bad neighbour must not break this page. */ }
  }
}
async function selectPage() {
  const version = ++generation;
  clearTimeout(warmTimer);
  resume = resume || !video.paused;
  clearVideo(); camera.disabled = true; $('cameras').hidden = true;
  pager.hidden = members.length <= 1;
  $('partition-label').textContent = `${members[page] || ''}  ${page + 1} / ${members.length}`;
  $('partition-label').title = members[page] || '';
  const root = pageRoot(page), {signal} = viewController;
  message('Preparing video…');
  const hit = cache.get(root, preferred);
  if (task && (task.root !== root || task.wanted !== preferred)) { task.controller.abort(); task = null; }
  try {
    const entry = hit || await acquire(root, preferred);
    if (version !== generation) return;
    preferred = entry.camera; currentKey = cache.key(root, preferred);
    camera.replaceChildren(...entry.cameras.map(name => new Option(name, name)));
    camera.value = preferred; camera.disabled = false; $('cameras').hidden = entry.cameras.length <= 1;
    objectUrl = URL.createObjectURL(entry.blob); video.dataset.cacheHit = String(Boolean(hit));
    video.addEventListener('loadeddata', () => {
      if (version !== generation) return;
      status.hidden = true;
      if (resume) video.play().catch(() => {});
      warmTimer = setTimeout(() => void warm(version), 150);
    }, {once: true, signal});
    video.src = objectUrl; metrics();
  } catch (error) {
    if (version === generation && error.name !== 'AbortError') message(error.message);
  }
}
video.addEventListener('play', () => { resume = true; });
video.addEventListener('pause', () => { if (objectUrl && video.currentSrc === objectUrl && video.readyState >= 2) resume = false; });
video.addEventListener('error', () => { if (objectUrl) message('This browser could not play the generated WebM preview'); });
camera.onchange = () => { preferred = camera.value; void selectPage(); };
function move(delta) {
  if (members.length <= 1) return;
  page = (page + delta + members.length) % members.length; void selectPage();
}
$('previous').onclick = () => move(-1); $('next').onclick = () => move(1);
let hovered = false;
document.body.onmouseenter = () => { hovered = true; };
document.body.onmouseleave = () => { hovered = false; };
document.addEventListener('keydown', event => {
  if (!hovered || pager.hidden || /^(INPUT|SELECT|VIDEO)$/.test(event.target.tagName)) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault(); move(event.key === 'ArrowLeft' ? -1 : 1);
  }
});
async function load(url) {
  generation++; clearTimeout(warmTimer); listingController?.abort();
  task?.controller.abort(); task = null; clearVideo(); cache.clear(); metrics();
  preferred = currentKey = ''; resume = false; pager.hidden = true; $('cameras').hidden = true;
  listingController = new AbortController(); const {signal} = listingController;
  message('Reading sequence…');
  try {
    const proxy = new URL(url, location.origin), parts = proxy.pathname.split('/').filter(Boolean);
    if (proxy.origin !== location.origin || parts[0] !== 'proxy' || parts.length < 3) throw Error('Expected a proxy directory URL');
    base = proxy.pathname.replace(/\/$/, '');
    const files = (await Promise.all(['p_*/*', 'p_*/images/*'].map(pattern => listing(base, pattern, signal)))).flat();
    signal.throwIfAborted(); members = partitions(files); page = 0; void selectPage();
  } catch (error) { if (!signal.aborted) message(error.message); }
}
window.addEventListener('message', event => {
  if (event.source !== parent || event.origin !== location.origin || event.data?.type !== 'hololab-viewer-state') return;
  const url = event.data.frames?.[0]?.proxy_url;
  if (url && new URL(url, location.origin).pathname.replace(/\/$/, '') !== base) void load(url);
});
window.addEventListener('pagehide', () => {
  generation++; clearTimeout(warmTimer); listingController?.abort(); task?.controller.abort(); clearVideo(); cache.clear();
});
</script>
</html>
