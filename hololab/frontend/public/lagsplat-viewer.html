<!doctype html>
<meta charset="utf-8">
<style>
  body{margin:0;padding:8px;background:#11151c;color:#e9edf5;font:12px system-ui}
  canvas{display:block;width:min(100%,420px);height:auto;aspect-ratio:1;margin:8px auto;background:#000;border-radius:5px}
  button,input{accent-color:#7cb6ff}#s{color:#a9c8ee}
</style>
<b>LaGSplat Viewer</b> <span id="s">Loading model…</span>
<canvas id="c"></canvas>
<button id="p">Pause</button> <button id="r">Reset</button>
Time <input id="t" type="range" min="0" max="1000" value="0">
<!-- Official upstream files, vendored byte-for-byte. The adapter below only
     loads HoloLab's exported data and provides UI/lifecycle wiring. -->
<script src="/lagsplat-official/gs_splat.js"></script>
<script src="/lagsplat-official/krauss2_lnn_dyn.js"></script>
<script>
(()=>{'use strict';
const c=document.querySelector('#c'),s=document.querySelector('#s'),pause=document.querySelector('#p'),reset=document.querySelector('#r'),slider=document.querySelector('#t');
let D,M,splat,q,v,running=true,loaded=false,visible=!document.hidden,raf=0,last=0,accumulator=0,elapsed=0;
const meter=window.__lagsplatPerf={mode:'loading',renders:0,rafFrames:0,hiddenStops:0,lastMs:0,steps:0};
function values(x,d){return Array.isArray(x)?x:Array(d).fill(x);}
function packedData(data){const d=data.latent_dim,layout={},fields=[['mu_xy',2],['mz',d],['sxz_szzi',2*d],['szzi',d*(d+1)/2],['scond_inv',3],['alpha',1],['color',3]];let stride=0;for(const [name,n]of fields){layout[name]=[stride,stride+n];stride+=n;}const meta={d,K:data.gaussians.length,stride,layout},out=new Float32Array(meta.K*stride);data.gaussians.forEach((g,i)=>{const o=i*stride;out.set(g.p,o+layout.mu_xy[0]);out.set(values(g.mz,d),o+layout.mz[0]);out.set(g.jac,o+layout.sxz_szzi[0]);out.set(values(g.szzi,d*(d+1)/2),o+layout.szzi[0]);out.set(g.scinv,o+layout.scond_inv[0]);out[o+layout.alpha[0]]=g.a;out.set(g.c,o+layout.color[0]);});return {meta,buffer:out.buffer};}
function redraw(){if(!loaded)return;const started=performance.now(),z=Krauss2LNN.toZ(M,q);splat.render(z);meter.lastMs=performance.now()-started;meter.renders++;window.__lagsplatLastZ=Array.from(z);s.textContent='OURS: LNN ROLLOUT · z '+Array.from(z).map(x=>x.toFixed(3)).join(', ');}
function advance(n){for(let i=0;i<n;i++){const next=Krauss2LNN.step(M,q,v,{});q=next.q;v=next.v;meter.steps++;}}
function schedule(){if(!raf&&visible&&loaded)raf=requestAnimationFrame(loop)}
function loop(now){raf=0;meter.rafFrames++;if(!visible||document.hidden){meter.hiddenStops++;return;}if(!last)last=now;const delta=now-last;last=now;if(running){const ms=1000/M.fps;accumulator=Math.min(ms,accumulator+delta);if(accumulator>=ms){advance(1);accumulator=0;elapsed+=1/M.fps;slider.value=Math.min(1000,elapsed*100);redraw();}}schedule();}
function setVisible(next){visible=next&&!document.hidden;if(!visible&&raf){cancelAnimationFrame(raf);raf=0;meter.hiddenStops++;}if(visible)schedule();}
new IntersectionObserver(es=>setVisible(es[0].isIntersecting)).observe(c);document.addEventListener('visibilitychange',()=>setVisible(!document.hidden));
function initial(){const d=M.d;q=Float64Array.from(D.initial_u||Krauss2LNN.toU(M,values(D.zmid,d)));v=Float64Array.from(D.initial_v||Array(d).fill(0));elapsed=0;accumulator=0;slider.value=0;}
function ready(){try{const packed=packedData(D);splat=GSSplat.create(c,packed.buffer,packed.meta,{maxSide:256});}catch(err){s.textContent='Official WebGL renderer unavailable: '+err.message;console.error(err);return;}initial();loaded=true;meter.mode='official-webgl2';redraw();schedule();}
function boot(url){if(!url||loaded)return;const base=url.replace(/\/[^/]*$/,'/');Promise.all([fetch(url).then(r=>{if(!r.ok)throw Error('gaussians '+r.status);return r.text();}),fetch(base+'lnn_meta.js').then(r=>{if(!r.ok)throw Error('lnn_meta '+r.status);return r.text();})]).then(([a,b])=>{eval(a);eval(b);D=window.PEND_DATA;M=window.X_LNN;if(!D||!M)throw Error('missing official export');ready();}).catch(err=>{s.textContent='Official viewer data unavailable: '+err.message;console.error(err);});}
addEventListener('message',e=>{if(e.data?.type==='lagsplat-model')boot(e.data.url);if(e.data?.type==='hololab-viewer-state')boot(e.data.frames?.[0]?.proxy_url);});
pause.onclick=()=>{running=!running;pause.textContent=running?'Pause':'Play';if(running)schedule();};reset.onclick=()=>{if(loaded){initial();redraw();}};slider.oninput=()=>{if(!loaded)return;initial();advance(Math.round(Number(slider.value)/100*M.fps));elapsed=Number(slider.value)/100;redraw();};
})();
</script>
