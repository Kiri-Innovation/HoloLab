<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#11151c;color:#e9edf5;font:12px system-ui;padding:8px}canvas{display:block;width:min(100%,420px);margin:8px auto;background:#000;border-radius:5px}button,input{accent-color:#7cb6ff}#s{color:#a9c8ee}</style><b>LaGSplat Viewer</b> <span id=s>Loading model…</span><canvas id=c width=128 height=128></canvas><button id=p>Pause</button> <button id=r>Reset</button> Time <input id=t type=range min=0 max=1000 value=0>
<script>
(()=>{'use strict';
const c=document.querySelector('#c'),s=document.querySelector('#s'),p=document.querySelector('#p'),r=document.querySelector('#r'),t=document.querySelector('#t');
let D,S,run=true,elapsed=0,loaded=false,visible=!document.hidden,raf=0,lastTick=0,draw,gl,ctx;
const meter=window.__lagsplatPerf={mode:'loading',renders:0,rafFrames:0,hiddenStops:0,lastMs:0};
function finish(z,started){meter.lastMs=performance.now()-started;meter.renders++;s.textContent='OURS: LNN ROLLOUT · z '+z.map(v=>v.toFixed(3)).join(', ')}
function software(){ctx=c.getContext('2d');meter.mode='software';draw=()=>{const started=performance.now(),W=c.width,H=c.height,img=ctx.createImageData(W,H),z=S.toZ(S.state.z),d=z.length;for(const g of D.gaussians){const mz=Array.isArray(g.mz)?g.mz:[g.mz],zi=Array.isArray(g.szzi)?g.szzi:[g.szzi],dz=z.map((v,i)=>v-(mz[i]||0));let q=0,k=0;for(let i=0;i<d;i++)for(let j=i;j<d;j++,k++)q+=(i===j?1:2)*(zi[k]||0)*dz[i]*dz[j];q=Math.min(q,20);const op=Math.min(.99,g.a*Math.exp(-.5*q));if(op<.004)continue;let mx=g.p[0],my=g.p[1];for(let i=0;i<d;i++){mx+=(g.jac[i]||0)*dz[i];my+=(g.jac[d+i]||0)*dz[i]}const A=g.scinv[0],B=g.scinv[1],C=g.scinv[2],det=A*C-B*B;if(!(det>0))continue;const R=Math.ceil(3*Math.sqrt(Math.max(C/det,A/det))*Math.max(W,H));for(let y=Math.max(0,Math.floor(my*H-R));y<=Math.min(H-1,Math.ceil(my*H+R));y++)for(let x=Math.max(0,Math.floor(mx*W-R));x<=Math.min(W-1,Math.ceil(mx*W+R));x++){const dx=(x+.5)/W-mx,dy=(y+.5)/H-my,e=A*dx*dx+2*B*dx*dy+C*dy*dy;if(e>18)continue;const a=op*Math.exp(-.5*e),n=4*(y*W+x),keep=1-a;img.data[n]=g.c[0]*255*a+img.data[n]*keep;img.data[n+1]=g.c[1]*255*a+img.data[n+1]*keep;img.data[n+2]=g.c[2]*255*a+img.data[n+2]*keep;img.data[n+3]=255}}ctx.putImageData(img,0,0);finish(z,started)}}
function webgl(){gl=c.getContext('webgl2',{alpha:false,premultipliedAlpha:true,preserveDrawingBuffer:true});if(!gl)return false;
const vs='#version 300 es\nlayout(location=0)in vec2 aCorner;layout(location=1)in vec2 aP;layout(location=2)in vec4 aM;layout(location=3)in vec4 aJx;layout(location=4)in vec4 aJy;layout(location=5)in vec4 aZ0;layout(location=6)in vec4 aZ1;layout(location=7)in vec4 aZ2;layout(location=8)in vec4 aZ3;layout(location=9)in vec3 aK;layout(location=10)in vec3 aColor;layout(location=11)in float aAlpha;uniform vec4 uZ;uniform vec2 uSize;out vec2 vDelta;flat out vec3 vK;flat out vec3 vColor;flat out float vOpacity;void main(){vec4 d=uZ-aM;float q=dot(d,vec4(dot(aZ0,d),dot(aZ1,d),dot(aZ2,d),dot(aZ3,d)));vOpacity=min(.99,aAlpha*exp(-.5*min(q,20.)));float det=aK.x*aK.z-aK.y*aK.y;if(!(det>0.)||vOpacity<.004){gl_Position=vec4(2.,2.,0.,1.);return;}float radius=3.*sqrt(max(aK.z/det,aK.x/det));vDelta=aCorner*radius*max(uSize.x,uSize.y)/uSize;vec2 pos=aP+vec2(dot(aJx,d),dot(aJy,d))+vDelta;gl_Position=vec4(pos.x*2.-1.,1.-pos.y*2.,0.,1.);vK=aK;vColor=aColor;}';
const fs='#version 300 es\nprecision highp float;in vec2 vDelta;flat in vec3 vK;flat in vec3 vColor;flat in float vOpacity;out vec4 outColor;void main(){float e=vK.x*vDelta.x*vDelta.x+2.*vK.y*vDelta.x*vDelta.y+vK.z*vDelta.y*vDelta.y;if(e>18.)discard;float a=vOpacity*exp(-.5*e);outColor=vec4(vColor*a,a);}';
function shader(type,src){const sh=gl.createShader(type);gl.shaderSource(sh,src);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(sh));return sh}let program;try{program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program))}catch(e){console.warn('LaGSplat WebGL fallback',e);return false}
const N=D.gaussians.length,main=new Float32Array(N*33),color=new Float32Array(N*4);for(let n=0;n<N;n++){const g=D.gaussians[n],o=n*33,m=Array.isArray(g.mz)?g.mz:[g.mz],j=g.jac,zi=Array.isArray(g.szzi)?g.szzi:[g.szzi],d=m.length;main[o]=g.p[0];main[o+1]=g.p[1];for(let i=0;i<d&&i<4;i++){main[o+2+i]=m[i]||0;main[o+6+i]=j[i]||0;main[o+10+i]=j[d+i]||0}for(let i=0;i<d&&i<4;i++)for(let j2=0;j2<d&&j2<4;j2++){const lo=Math.min(i,j2),hi=Math.max(i,j2),index=lo*d-lo*(lo-1)/2+hi-lo;main[o+14+i*4+j2]=zi[index]||0}main.set(g.scinv,o+30);color.set([g.c[0],g.c[1],g.c[2],g.a],n*4)}
function attr(loc,size,stride,offset,divisor=1){gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,size,gl.FLOAT,false,stride,offset);gl.vertexAttribDivisor(loc,divisor)}
const mainBuffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,mainBuffer);gl.bufferData(gl.ARRAY_BUFFER,main,gl.STATIC_DRAW);for(const [loc,size,offset] of [[1,2,0],[2,4,8],[3,4,24],[4,4,40],[5,4,56],[6,4,72],[7,4,88],[8,4,104],[9,3,120]])attr(loc,size,132,offset);
const colorBuffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,colorBuffer);gl.bufferData(gl.ARRAY_BUFFER,color,gl.STATIC_DRAW);attr(10,3,16,0);attr(11,1,16,12);
const cornerBuffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,cornerBuffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);attr(0,2,8,0,0);
const uz=gl.getUniformLocation(program,'uZ'),us=gl.getUniformLocation(program,'uSize');gl.useProgram(program);gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);meter.mode='webgl2';
draw=()=>{const started=performance.now(),z=S.toZ(S.state.z),v=new Float32Array(4);v.set(z.slice(0,4));gl.viewport(0,0,c.width,c.height);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);gl.useProgram(program);gl.uniform4fv(uz,v);gl.uniform2f(us,c.width,c.height);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,N);finish(z,started)};return true}
function schedule(){if(!raf&&visible&&loaded)raf=requestAnimationFrame(loop)}function loop(now){raf=0;meter.rafFrames++;if(!visible||document.hidden){meter.hiddenStops++;return}if(!lastTick)lastTick=now;const delta=now-lastTick;if(delta>=1000/30){lastTick=now;if(run){const dt=Math.min(.05,delta/1000);S.tick(dt);elapsed+=dt;t.value=Math.min(1000,elapsed*100);draw()}}schedule()}function setVisible(next){visible=next&&!document.hidden;if(!visible&&raf){cancelAnimationFrame(raf);raf=0;meter.hiddenStops++}if(visible)schedule()}new IntersectionObserver(entries=>setVisible(entries[0].isIntersecting)).observe(c);document.addEventListener('visibilitychange',()=>setVisible(!document.hidden));
function ready(){c.width=c.height=D.tile||128;if(!webgl())software();loaded=true;draw();schedule()}function boot(url){if(!url||loaded)return;const base=url.replace(/\/[^/]*$/,'/');Promise.all([fetch(url).then(x=>x.text()),fetch(base+'dynamics.js').then(x=>x.text())]).then(([a,b])=>{eval(a);eval(b);D=PEND_DATA;S=createPendSim(PEND_META);ready()}).catch(err=>{s.textContent='Viewer data unavailable: '+err.message;console.error(err)})}
addEventListener('message',e=>{if(e.data?.type==='lagsplat-model')boot(e.data.url);if(e.data?.type==='hololab-viewer-state')boot(e.data.frames?.[0]?.proxy_url)});p.onclick=()=>{run=!run;p.textContent=run?'Pause':'Play';if(run)schedule()};r.onclick=()=>{if(S){S.reset();elapsed=0;draw()}};t.oninput=()=>{if(!S)return;S.reset();for(let n=0;n<t.value/100*30;n++)S.tick(1/30);elapsed=t.value/100;draw()};
})();
</script>
