name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Reject AI attribution in commits
        run: |
          BEFORE="${{ github.event.before }}"
          RANGE="${BEFORE}..${{ github.sha }}"
          if [ -z "$BEFORE" ] || ! git rev-parse --quiet --verify "$BEFORE" 2>/dev/null; then
            RANGE="HEAD"
          fi
          FOUND=$(git log --format=%B "$RANGE" | grep -inE "co-authored-by:.*claude|generated with .*claude|noreply@anthropic\.com" || true)
          if [ -n "$FOUND" ]; then
            echo "::error::commit message contains AI attribution — please rewrite commits"
            printf '%s\n' "$FOUND"
            exit 1
          fi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          mkdir -p hololab/frontend/dist
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        working-directory: hololab
        run: ruff check .

      - name: Ruff (format check)
        working-directory: hololab
        run: ruff format --check .

      - name: Pytest
        run: pytest -q
