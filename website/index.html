  <title>Visual workflows for vision algorithms — HoloLab</title>
  <script>
    // Only the unprefixed home negotiates language. Shared deep links are explicit.
    if (location.pathname === '/') {
      let preferred;
      try { preferred = localStorage.getItem('hololab.website.locale'); } catch {}
      if (preferred !== 'en' && preferred !== 'zh-CN') preferred = (navigator.languages?.[0] || navigator.language || '').toLowerCase().startsWith('zh') ? 'zh-CN' : 'en';
      if (preferred === 'zh-CN') location.replace('/zh-CN/' + location.search + location.hash);
    }
    try { const t = localStorage.getItem('hololab.website.theme'); document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
  </script>
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
