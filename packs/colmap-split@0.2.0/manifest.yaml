apiVersion: hololab.dev/v1
kind: Algorithm
name: colmap-split
version: 0.2.0
description: >
  Explode a ``colmap-cams`` handle into three typed outputs:
  ``pinhole_intrinsics`` (COLMAP PINHOLE cameras.txt — intrinsics only,
  no distortion), ``distortion`` (JSON with distortion coefficients +
  model name — the only non-COLMAP-native output; COLMAP has no
  single-file format for distortion alone), and ``poses`` (COLMAP
  images.txt, 2D observations stripped).
source_entry: split.py
category: "reconstruction/colmap"

docs: |
  ### Why distortion is JSON (and everything else isn't)

  COLMAP's ``cameras.txt`` schema bundles pinhole intrinsics and
  distortion into one row (e.g. ``1 OPENCV W H fx fy cx cy k1 k2 p1 p2``).
  COLMAP has no native file format that carries *only* the distortion
  coefficients — splitting them out requires an out-of-band schema.
  This pack uses a minimal JSON envelope for that one output and stays
  COLMAP-native for everything else.

  ### Reassembly invariant

  ``pinhole_intrinsics`` (fx fy cx cy) and ``distortion.json``
  (model name + remaining params in original COLMAP order) together
  reconstruct the original cameras.txt entry numerically:

  * 4-param models (OPENCV, OPENCV_FISHEYE, FULL_OPENCV, PINHOLE, FOV,
    THIN_PRISM_FISHEYE): ``fx fy cx cy`` → PINHOLE verbatim.
  * 3-param models (SIMPLE_PINHOLE, SIMPLE_RADIAL, RADIAL, SIMPLE_OPENCV):
    single focal length ``f`` written as ``fx = fy = f`` in PINHOLE output.
    Reassembly reads ``fx`` and drops the duplicate ``fy``.

  ### Fan-out

  ``arrayable: true`` — when the input is ``arrayed<colmap-cams>`` the
  framework fans out one shard per element and aggregates three scalar
  outputs back to ``arrayed<T>`` per port. The scalar broadcast
  (``_discover_element_ids`` in ``hololab/gateway/execution.py``) lets
  downstream arrayed consumers (``image-undistort``, ``colmap-triangulate``)
  receive the scalar ``pinhole_intrinsics`` / ``distortion`` / ``poses``
  without an explicit ``arrayfy`` node.

arrayable: true

inputs:
  cams:
    tags: [colmap-cams]
    description: "A colmap-cams handle (cameras.txt + images.txt)."

outputs:
  pinhole_intrinsics:
    tags: [colmap-cameras-txt]
    description: >
      COLMAP PINHOLE cameras.txt — intrinsics only (fx fy cx cy).
      Valid COLMAP text, readable by any COLMAP tool. Distortion
      is stripped to ``distortion``.
  distortion:
    tags: [camera-distortion-json]
    description: >
      JSON: ``{"schema_version":1,"cameras":[{"camera_id":N,
      "model":"OPENCV","params":[k1,k2,p1,p2]}]}``.
      Pair with ``pinhole_intrinsics`` to reassemble the full camera model.
  poses:
    tags: [colmap-images-txt]
    description: "COLMAP images.txt with 2D observations stripped (poses only)."

runtime:
  env: kiri
  gpu:
    required: false

exec:
  shell: |
    set -euo pipefail
    python "{{ pack_dir }}/split.py" \
      --cams "{{ inputs.cams }}" \
      --pinhole-intrinsics-out "{{ outputs.pinhole_intrinsics }}" \
      --distortion-out "{{ outputs.distortion }}" \
      --poses-out "{{ outputs.poses }}"

idempotency:
  marker: "{{ outputs.pinhole_intrinsics }}/.hololab-done"
