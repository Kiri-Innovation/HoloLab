apiVersion: hololab.dev/v1
kind: Algorithm
name: image-undistort
version: 0.1.0
description: >
  Undistort a ``frame_sequence`` using a paired
  ``camera-intrinsics`` + ``camera-distortion``. Emits a PINHOLE
  ``camera-intrinsics`` and an undistorted ``frame_sequence``. All three
  inputs are scalar per invocation — batch processing is the framework's
  job via the ``arrayed_toggle`` fan-out, not this pack's.
source_entry: undistort.py
category: "reconstruction/colmap"

docs: |
  Wraps COLMAP's ``image_undistorter``. The interesting bit is *typed
  inputs*: instead of consuming a monolithic ``colmap-cams`` handle, this
  pack takes the intrinsics and the distortion as two separate typed
  ports. That's what makes ``colmap-split`` actually useful — the
  distortion output is literally what gets consumed here.

  ### Fan-out contract (single-frame vs paired-arrays)

  The pack itself only knows how to undistort **one** (intrinsics,
  distortion, images) triple per invocation — there's no ``for image in
  images_array`` loop in the script. To process N frames the workflow
  wires ``arrayed<T>`` sources into each input and enables
  ``arrayed_toggle`` on the node; the framework then:

  1. Zips the three inputs by ``element_id`` (subdirectory name in each
     arrayed<T> parent). ``hololab/gateway/execution.py::_discover_element_ids``
     enforces set equality and raises ``WorkflowRunError`` with a
     length-and-diff summary when they disagree ("intrinsics has 21
     element(s); images has 20 element(s); only in 'intrinsics': ['cam_20']").
  2. Dispatches one shard per element, each seeing scalar handles at
     ``inputs.intrinsics`` / ``inputs.distortion`` / ``inputs.images``.

  If the same intrinsics + distortion apply to every image element
  (i.e. one shared camera model across time), broadcast them with
  ``arrayfy`` to the same element count as ``images``.

  ### How the split maps to the COLMAP call

  ``recombine_cameras_txt`` (in ``undistort.py``) matches ``camera_id``
  across the intrinsics and distortion JSON files, then rebuilds the
  original COLMAP ``cameras.txt`` line by concatenating the model's
  pinhole prefix (``[f, cx, cy]`` or ``[fx, fy, cx, cy]``) with the
  distortion tail. ``image_undistorter`` then needs a matching
  ``images.txt`` — which we synthesise with identity poses (undistortion
  is *intrinsic*; extrinsics don't affect the pixel remap), because
  poses are not part of this pack's typed inputs.

  Output layout::

      pinhole/                       # tag: camera-intrinsics
        intrinsics.json              # PINHOLE model + undistorted fx,fy,cx,cy,W,H
      undistorted/                   # tag: frame_sequence
        frames/
          <cam>.<ext>                # image_undistorter output, cropped

arrayable: true

inputs:
  intrinsics:
    tags: [camera-intrinsics]
    description: "Pinhole part of the shared camera (from colmap-split)."
  distortion:
    tags: [camera-distortion]
    description: "Distortion tail of the shared camera (from colmap-split)."
  images:
    tags: [frame_sequence]
    description: "Per-cam distorted images to undistort. Filenames map 1:1 into the output."

params:
  blank_pixels:
    type: int
    default: 0
    min: 0
    max: 1
    description: >
      Pass-through to ``image_undistorter --blank_pixels``. 0 (default) crops
      out invalid regions; 1 keeps the original size and fills with black.

outputs:
  pinhole:
    tags: [camera-intrinsics]
    description: "The PINHOLE model produced by image_undistorter (fx,fy,cx,cy adjusted, distortion dropped)."
  undistorted:
    tags: [frame_sequence]
    description: "Undistorted images, one per input image, at the PINHOLE resolution."

runtime:
  env: kiri
  gpu:
    required: false

exec:
  shell: |
    set -euo pipefail
    python "{{ pack_dir }}/undistort.py" \
      --intrinsics "{{ inputs.intrinsics }}" \
      --distortion "{{ inputs.distortion }}" \
      --images "{{ inputs.images }}" \
      --pinhole-out "{{ outputs.pinhole }}" \
      --undistorted-out "{{ outputs.undistorted }}" \
      --scratch "{{ scratch_dir }}" \
      --blank-pixels {{ params.blank_pixels }}

idempotency:
  marker: "{{ outputs.pinhole }}/.hololab-done"
