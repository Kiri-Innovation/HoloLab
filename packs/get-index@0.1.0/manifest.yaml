apiVersion: hololab.dev/v1
kind: Algorithm
name: get-index
version: 0.1.0
description: >
  Pick one element of an ``arrayed<T>`` handle by 0-based index (sorted
  subdir order). Produces the plain T handle.
category: "utility/arrayed"

docs: |
  Element access utility. ``idx`` is a param (static "pick this one" —
  no natural int-producing sibling to wire), not an input port. Element
  order follows ``sorted(os.listdir())`` on the arrayed<T> directory,
  matching the framework's fan-out element order.

  Output tags propagate from ``arr`` via ``tags_from: arr``.

  Typical use: pick the first frame of a regrouped arrayed<frame_sequence>
  to feed a SfM node that only wants one frame's cameras.

inputs:
  arr:
    tags: [any]
    arrayed: true
    description: "Any arrayed<T> handle."

params:
  idx:
    type: int
    default: 0
    min: 0
    description: "0-based element index (element_ids = sorted(listdir(arr)))."

outputs:
  item:
    tags: [any]
    tags_from: arr
    # Derive the output's arrayed shape from the wired input, dropping
    # the outermost dim (get-index picks one element of that axis).
    # ``arrayed<arrayed<image>>[frame,cam]`` → ``arrayed<image>[cam]``;
    # ``arrayed<image>[cam]`` → scalar ``image``. Gateway + frontend both
    # walk the wire to resolve this at display time — see
    # :func:`hololab.gateway.workflows.effective_output_dim_labels`.
    dim_labels_from_input: arr
    dim_labels_drop_outer: 1
    description: "The idx-th element of arr, symlinked."

runtime:
  env: kiri
  gpu:
    required: false

exec:
  shell: |
    set -euo pipefail
    IDX={{ params.idx }}
    # Enumerate direct children of the arrayed dir in sorted order —
    # find -printf '%f\n' gives just the filename (no leading path), and
    # -mindepth 1 -maxdepth 1 limits to immediate children, matching
    # sorted(os.listdir()) semantics used by the framework's fan-out.
    mapfile -t ENTRIES < <(find "{{ inputs.arr }}" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
    # Count via find -printf '.' (same as array-length). Two alternative
    # approaches both have issues in this manifest context:
    # - bash array length syntax (dollar + hash + ENTRIES + [@]) — the
    #   hash-brace sequence is Jinja2's comment delimiter; template render
    #   would fail at the opening tag.
    # - printf '%s\n' "${ENTRIES[@]}" | wc -l — bash printf with no
    #   arguments still emits a newline, so wc -l returns 1 for an empty
    #   array; the bounds check then passes and ENTRIES[0] throws.
    N=$(find "{{ inputs.arr }}" -mindepth 1 -maxdepth 1 -printf '.' | wc -c | tr -d ' ')
    if [ "$IDX" -ge "$N" ] || [ "$IDX" -lt 0 ]; then
      echo "ERROR: idx $IDX out of range (array size $N)" >&2
      exit 1
    fi
    PICKED="{{ inputs.arr }}/${ENTRIES[$IDX]}"
    # The framework pre-creates outputs.item as an empty dir (storage=dir
    # default). Remove it and drop a symlink to the picked element in its
    # place so downstream sees the same layout as the array's element.
    rm -rf "{{ outputs.item }}"
    ln -s "$(readlink -f "$PICKED")" "{{ outputs.item }}"
    echo "get-index: picked [$IDX] = ${ENTRIES[$IDX]}"
