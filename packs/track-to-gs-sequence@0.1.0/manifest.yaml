apiVersion: hololab.dev/v1
kind: Algorithm
name: track-to-gs-sequence
version: 0.1.0
description: >
  Phase-A2 of the single-video Sharp-4DGS pipeline. Takes a camera_track
  (MegaSaM reconstruction + COLMAP dataset) and produces the per-frame
  Sharp gaussians sequence (gaussians_finalized/frame_XXXXXX.ply). This
  is the expensive Sharp inference step; splitting it out lets you rerun
  it with different post-processing flags without re-tracking the
  camera.
category: "reconstruction/sharp-4dgs"
docs: |
  **Phase A2** of the Sharp-4DGS pipeline. Runs Sharp per-frame inference
  on the tracked camera dataset and finalizes the per-frame gaussians.

  - **Input:** `camera_track` from `video-to-camera-track` (A1).
  - **Output:** `gs_sequence` with `gaussians_finalized/frame_XXXXXX.ply`
    alongside A1's `frames/`, `colmap/`, `megasam_run/` (hardlinked, so
    deleting this handle doesn't strand A1).
  - `rescale_sharp_to_pts` should match A1's tracked scale; enable
    `occlusion_completion` if you need off-frustum fill.
  - Expensive step (2–20 min); rerun A3 rather than this when tweaking
    layout / view count.

inputs:
  camera_track:
    tags: [camera_track]
    description: >
      MegaSaM reconstruction directory from video-to-camera-track;
      expected to contain frames/, colmap/sparse/0/, and megasam_run/.

params:
  rescale_sharp_to_pts:
    type: bool
    default: true
    description: "Rescale Sharp depth to the tracked pts/ scale."

  occlusion_completion:
    type: bool
    default: false
    description: "Enable occlusion-completion finalizer (fills off-frustum regions)."

  sharp_repo:
    type: string
    description: "Absolute path to the Kiri4DGS repo root on this node (contains sharp-4dgs/)."

outputs:
  gs_sequence:
    tags: [gs_sequence, sharp4dgs_reconstruct]
    description: >
      Reconstruction directory with the Sharp gaussians layered on top of
      the A1 outputs. Includes gaussians_finalized/, frames/, colmap/,
      megasam_run/ — the whole workdir gsseq_to_multiview needs. A1's
      files are hardlinked in (same-fs, so effectively free) so this
      handle can be deleted without touching A1.

runtime:
  env: kiri
  gpu:
    required: true
    vram_gb_min: 8
  expected_duration_min: [2, 20]
  resources:
    # Empirical baseline @ 50 frames (occlusion_completion=True):
    #   * scratch ~ 16 GiB (A1 hardlinks + per-frame gaussians_raw/
    #     processed/finalized). Hardlinks share inodes with A1 so this
    #     is disk-free-ish, but the logical footprint still needs to fit
    #     until the mv-into-output at the end.
    #   * host RAM peak ~ 30 GiB (all_frames_data + occlusion-completion
    #     mask accumulator; see the sharp-4dgs streaming fix on a8238d2
    #     which bounds this to O(2*workers) per-frame).
    #   * VRAM peak ~ 10 GiB (per-frame Sharp inference).
    # 161 frames used to blow past 62 GiB before that fix; declared
    # minimums here reflect the ~50-frame demo baseline.
    scratch_gb: 20.0
    mem_gb: 32.0
    gpu_mem_gb: 12.0

exec:
  # colmap_to_3d.py mutates its ``-o`` dir in place (it writes
  # gaussians_raw/, gaussians_processed/, gaussians_finalized/ into the
  # same tree that contains frames/ + colmap/). We can't just point ``-o``
  # at the A1 handle — the input handle contract is read-only. Instead we
  # hardlink A1's contents into a scratch workdir (same filesystem, zero
  # disk cost), run colmap_to_3d there, then move the whole workdir into
  # our declared output.
  shell: |
    set -euo pipefail
    cd "{{ params.sharp_repo }}"

    SRC="{{ inputs.camera_track }}"
    WORK="{{ scratch_dir }}/reconstruct"
    OUT="{{ outputs.gs_sequence }}"
    mkdir -p "$WORK"
    echo "[ITER 1/2] preparing scratch workdir from $SRC"
    # ``cp -al`` recursively hardlinks — inodes shared with A1, so a later
    # A1 delete doesn't strand this dir, and disk usage stays 0 for the
    # copied bytes. Requires same-filesystem (workspace_root scoped, so
    # this holds).
    cp -al "$SRC/." "$WORK/"

    RESCALE=""
    if [ "{{ params.rescale_sharp_to_pts }}" = "True" ]; then
      RESCALE="--rescale-sharp-to-pts"
    fi
    OCC=""
    if [ "{{ params.occlusion_completion }}" = "True" ]; then
      OCC="--occlusion-completion"
    fi

    python sharp-4dgs/per-frame/colmap_to_3d.py \
      -o "$WORK" \
      --device cuda \
      $RESCALE \
      $OCC
    echo "[ITER 2/2] Sharp inference done"

    # Sanity gate: gaussians_finalized/ must have at least one PLY.
    test -d "$WORK/gaussians_finalized" || {
      echo "missing gaussians_finalized/" >&2; exit 3
    }
    if ! ls "$WORK/gaussians_finalized"/frame_*.ply >/dev/null 2>&1; then
      echo "no frame_*.ply under gaussians_finalized/" >&2
      exit 4
    fi

    mkdir -p "$OUT"
    # ``mv`` inside the same filesystem is instant — no byte copy.
    mv "$WORK"/* "$OUT/"

idempotency:
  marker: "{{ outputs.gs_sequence }}/.hololab-done"

progress:
  stdout_regex: '\[ITER (\d+)/(\d+)\]'

previews:
  - id: first_gs
    type: text
    path: "{{ outputs.gs_sequence }}/gaussians_finalized/frame_000000.ply"
