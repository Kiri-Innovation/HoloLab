apiVersion: hololab.dev/v1
kind: Algorithm
name: stg-to-splatv
version: 0.1.0
description: "Converts a SpacetimeGaussians training output directory to a .splatv file."
source_entry: ../../../Utils/STG_to_SplaTV/convert_to_splatv_lite.py
category: "export/splatv"
docs: |
  Converts a trained SpacetimeGaussians model directory to a single
  `.splatv` file ready for the browser viewer.

  - **Input:** `stg_model_dir` — must contain
    `point_cloud/iteration_N/point_cloud.ply`.
  - **Output:** `splatv` — single-file handle (previewed in-browser).
  - `iteration: -1` picks the latest available iteration; set explicitly
    to pin a specific checkpoint. `texw` controls SplaTV texture width.
  - Requires `utils_repo` pointing at the Kiri4DGS repo (uses
    `Utils/STG_to_SplaTV/convert_to_splatv_lite.py`). CPU-only, quick.

inputs:
  stg_model_dir:
    tags: [stg_model]
    description: "STG training output directory (contains point_cloud/iteration_N/point_cloud.ply)."

params:
  iteration:
    type: int
    default: -1
    description: "Which iteration to convert; -1 = latest available."

  texw:
    type: int
    default: 4096
    description: "Texture width in the resulting .splatv (see SplaTV wire format)."

  utils_repo:
    type: string
    description: "Absolute path to the Kiri4DGS repo root (contains Utils/STG_to_SplaTV/)."

outputs:
  splatv:
    tags: [splatv]
    storage: file
    description: "The exported .splatv file, single-file storage for browser viewers."
    # Preview: derived from the ``splatv`` tag via the gateway's
    # tag→viewer registry. No per-pack ``preview:`` declaration needed
    # — any pack that outputs this tag automatically gets the splatv
    # viewer. See hololab/gateway/tag_viewers.py.

runtime:
  env: kiri
  gpu:
    required: false
  expected_duration_min: [0.05, 1.0]
  resources:
    # Empirical baseline @ default texw=4096:
    #   * scratch < 0.5 GiB (converter reads the PLY and writes one file).
    #   * host RAM peak ~ 3 GiB (holds the full point cloud in-mem).
    #   * GPU not required.
    scratch_gb: 1.0
    mem_gb: 4.0

exec:
  # Pick the point_cloud.ply of the requested (or latest) iteration and hand
  # it to the STG_to_SplaTV lite converter. The output is a single .splatv
  # file — hence storage: file on the output port.
  shell: |
    set -euo pipefail

    STG="{{ inputs.stg_model_dir }}"
    if [ ! -d "$STG/point_cloud" ]; then
      echo "stg_model dir lacks point_cloud/: $STG" >&2
      exit 2
    fi

    IT="{{ params.iteration }}"
    if [ "$IT" = "-1" ]; then
      # Pick the highest iteration_N directory.
      IT=$(ls -1 "$STG/point_cloud" | grep -oE 'iteration_[0-9]+' | \
        awk -F_ '{print $2}' | sort -n | tail -1)
      if [ -z "$IT" ]; then
        echo "no iteration_N dirs under $STG/point_cloud" >&2
        exit 2
      fi
    fi
    echo "[ITER 1/1] converting iteration $IT"

    PLY="$STG/point_cloud/iteration_${IT}/point_cloud.ply"
    if [ ! -f "$PLY" ]; then
      echo "point_cloud.ply not found: $PLY" >&2
      exit 2
    fi

    # Cameras JSON is optional; splatv converter uses it for the default view.
    CAM_ARG=""
    if [ -f "$STG/cameras.json" ]; then
      CAM_ARG="--cameras $STG/cameras.json"
    fi

    OUT="{{ outputs.splatv }}"
    OUT_DIR="$(dirname "$OUT")"
    mkdir -p "$OUT_DIR"

    # The converter auto-appends ``.splatv`` if the ``--out`` path doesn't end
    # in it, so we write to a scratch path with the extension and rename to
    # the handle-book location (which HoloLab picks by port name, no ext).
    TMP="$OUT_DIR/_convert_scratch.splatv"
    python "{{ params.utils_repo }}/Utils/STG_to_SplaTV/convert_to_splatv_lite.py" \
      --ply "$PLY" \
      --out "$TMP" \
      --texw {{ params.texw }} \
      $CAM_ARG
    mv "$TMP" "$OUT"

idempotency:
  marker: "{{ outputs.splatv }}.hololab-done"

progress:
  stdout_regex: '\[ITER (\d+)/(\d+)\]'

previews:
  - id: splatv_file
    type: log
    path: "{{ outputs.splatv }}.hololab-done"
