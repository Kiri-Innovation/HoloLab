apiVersion: hololab.dev/v1
kind: Algorithm
name: gs-seq-to-multiview-colmap
version: 0.1.0
description: >
  Phase-A3 of the single-video Sharp-4DGS pipeline. Renders the Sharp
  gaussians sequence into virtual multi-view COLMAP dirs (one colmap_N
  per starttime index) so STG can consume them as its input dataset.
  This is the fastest of the three steps and the one you'll most often
  rerun to tune layout / view count without touching camera tracking or
  Sharp inference.
source_entry: sharp-4dgs/per-frame/gsseq_to_multiview.py
category: "reconstruction/multiview-colmap"
docs: |
  **Phase A3** of the Sharp-4DGS pipeline. Renders the Sharp gaussians
  sequence into virtual multi-view COLMAP directories that STG can train
  on. Fastest of the three phases — the one you rerun to tune layouts.

  - **Input:** `gs_sequence` from `track-to-gs-sequence` (A2).
  - **Output:** `colmap_dir` containing `colmap_0/`, `colmap_1/`, …
    (one per starttime index up to `n_frames`).
  - `layout` picks the virtual-camera rig; `width`/`height` control
    per-view image size; `gt_instri` uses per-frame GT intrinsics.
  - Requires `sharp_repo`; GPU needed but cheap (~1–10 min).

inputs:
  gs_sequence:
    tags: [gs_sequence]
    description: >
      Reconstruction directory produced by track-to-gs-sequence; expected
      to contain gaussians_finalized/frame_XXXXXX.ply plus frames_preprocessed/
      or frames/ for GT reference.

params:
  n_frames:
    type: int
    default: 50
    min: 1
    description: "How many per-frame COLMAP dirs to export (gsseq_to_multiview --frames)."

  layout:
    type: enum
    values: [horz10, horz10x3, horz10x3_9x2x2, horz6x3_5x3x2, horz6x3_5x2x2]
    default: horz10
    description: "Virtual multi-view camera layout."

  width:
    type: int
    default: 1280
  height:
    type: int
    default: 720

  gt_instri:
    type: bool
    default: false
    description: "Use per-frame GT intrinsics from COLMAP (overrides --fov_y / --gt_f_px)."

  sharp_repo:
    type: string
    description: "Absolute path to the Kiri4DGS repo root on this node (contains sharp-4dgs/)."

outputs:
  colmap_dir:
    tags: [colmap, sharp4dgs_export]
    description: >
      First-frame virtual-view COLMAP directory ready for stg-train
      (contains colmap_0/, colmap_1/, … according to --frames).

runtime:
  env: kiri
  gpu:
    required: true
    vram_gb_min: 8
  expected_duration_min: [1, 10]
  resources:
    # Empirical baseline @ 50 frames, default horz10 layout / 1280x720:
    #   * scratch ~ 2 GiB (per-frame point/colmap_N/ export).
    #   * host RAM peak ~ 4 GiB.
    #   * VRAM peak ~ 4 GiB (renderer).
    scratch_gb: 3.0
    mem_gb: 6.0
    gpu_mem_gb: 6.0

exec:
  # gsseq_to_multiview writes per-frame ``point/colmap_N/`` subdirs into
  # its ``-o`` dir. STG's dataset reader requires the source basename to
  # match ``colmap_<N>``, so we mv the whole colmap_* tree into the
  # declared output rather than flattening.
  shell: |
    set -euo pipefail
    cd "{{ params.sharp_repo }}"

    IN="{{ inputs.gs_sequence }}"
    FIRST_PLY="$IN/gaussians_finalized/frame_000000.ply"
    test -f "$FIRST_PLY" || { echo "missing $FIRST_PLY" >&2; exit 2; }

    EXPORT_ROOT="{{ scratch_dir }}/export"
    OUT="{{ outputs.colmap_dir }}"
    mkdir -p "$EXPORT_ROOT" "$OUT"
    echo "[ITER 1/1] rendering multi-view from $FIRST_PLY"

    GT_INSTRI=""
    if [ "{{ params.gt_instri }}" = "True" ]; then
      GT_INSTRI="--gt_instri"
    fi

    python sharp-4dgs/per-frame/gsseq_to_multiview.py \
      "$FIRST_PLY" \
      -o "$EXPORT_ROOT" \
      --layout {{ params.layout }} \
      --frames {{ params.n_frames }} \
      --width {{ params.width }} --height {{ params.height }} \
      $GT_INSTRI

    # gsseq writes into $EXPORT_ROOT/point/colmap_*/; move that tree into
    # the declared output. STG will read (input_dir)/colmap_0 downstream.
    for d in "$EXPORT_ROOT"/point/colmap_*; do
      test -d "$d" || continue
      mv "$d" "$OUT/"
    done

    ls "$OUT"/colmap_0 >/dev/null 2>&1 || {
      echo "no colmap_0/ produced" >&2; exit 3
    }

idempotency:
  marker: "{{ outputs.colmap_dir }}/.hololab-done"

progress:
  stdout_regex: '\[ITER (\d+)/(\d+)\]'

previews:
  - id: sample_view
    type: image
    glob: "{{ outputs.colmap_dir }}/colmap_0/images/view_*.png"
