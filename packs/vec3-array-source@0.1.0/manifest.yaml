apiVersion: hololab.dev/v1
kind: Algorithm
name: vec3-array-source
version: 0.1.0
description: Initialize ordered vec3 attributes for compose-video.
category: source/array
source_entry: run.py
docs: |-
  x, y and scale are native float arrays of equal length, one component per layer. Scale must be > 0; x/y are top-left canvas ratios.
  Pure initialization: no input ports or IDs. Values are emitted in parameter order as 0000, 0001, ... (padding grows uniformly beyond 9999).
  compose-video pairs arrays by position, not by filename. Supply exactly one value per video layer.
  Legacy JSON-string items without IDs remain accepted by standalone execution.
  CPU-only, env kiri. Uses a fresh empty output directory; validates before publishing. No ASE parameter binding or dynamic input ports.
inputs: {}
params:
  x:
    type: array
    items: float
    default: []
    description: x component, one per video layer; x/y/scale lengths must match.
  y:
    type: array
    items: float
    default: []
    description: y component, one per video layer; x/y/scale lengths must match.
  scale:
    type: array
    items: float
    default: []
    description: scale component, one per video layer; x/y/scale lengths must match.
outputs:
  transforms:
    tags:
    - vec3
    storage: dir
    arrayed: true
    dim_labels:
    - layer
runtime:
  env: kiri
  gpu:
    required: false
  resources:
    scratch_gb: 0.1
    mem_gb: 0.5
exec:
  shell: |
    set -euo pipefail
    python "{{ pack_dir }}/run.py" <<'HOLOLAB_ARRAY_CONFIG'
    {{ {'inputs': inputs, 'outputs': outputs, 'params': params} | tojson }}
    HOLOLAB_ARRAY_CONFIG
progress:
  stdout_regex: \[ITER (\d+)/(\d+)\]
