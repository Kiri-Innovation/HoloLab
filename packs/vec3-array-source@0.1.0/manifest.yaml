apiVersion: hololab.dev/v1
kind: Algorithm
name: vec3-array-source
version: 0.1.0
description: Produce ID-aligned vec3 attributes for compose-video.
category: source/array
source_entry: run.py
docs: |-
  x, y and scale are native float arrays of equal length, one component per layer. Scale must be > 0; x/y are top-left canvas ratios.
  ids is an optional string array. Leave empty when videos is connected to bind lexically sorted video IDs; otherwise provide one explicit ID per layer. Duplicate IDs and count mismatches are rejected.
  Legacy JSON-string items remain accepted at execution and are converted when edited in Inspector.
  CPU-only, env kiri. Uses a fresh empty output directory; validates before publishing. No ASE parameter binding or dynamic input ports.
inputs:
  videos:
    tags:
    - video-source
    storage: dir
    arrayed: true
    dim_labels:
    - layer
    required: false
    require_axis_label_match: false
params:
  ids:
    type: array
    items: string
    default: []
    description: Optional explicit layer IDs; leave empty to use the connected videos order.
  x:
    type: array
    items: float
    default: []
    description: x component, one per video layer; x/y/scale lengths must match.
  y:
    type: array
    items: float
    default: []
    description: y component, one per video layer; x/y/scale lengths must match.
  scale:
    type: array
    items: float
    default: []
    description: scale component, one per video layer; x/y/scale lengths must match.
outputs:
  transforms:
    tags:
    - vec3
    storage: dir
    arrayed: true
    dim_labels:
    - layer
runtime:
  env: kiri
  gpu:
    required: false
  resources:
    scratch_gb: 0.1
    mem_gb: 0.5
exec:
  shell: |
    set -euo pipefail
    python "{{ pack_dir }}/run.py" <<'HOLOLAB_ARRAY_CONFIG'
    {{ {'inputs': inputs, 'outputs': outputs, 'params': params} | tojson }}
    HOLOLAB_ARRAY_CONFIG
progress:
  stdout_regex: \[ITER (\d+)/(\d+)\]
