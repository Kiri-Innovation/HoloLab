apiVersion: hololab.dev/v1
kind: Algorithm
name: image-undistort
version: 0.2.0
description: >
  Undistort a ``frame_sequence`` using the typed split from
  ``colmap-split@0.2.0``: ``pinhole_intrinsics`` (COLMAP PINHOLE
  cameras.txt) + ``distortion`` (JSON with distortion coefficients).
  Reassembles the full camera model internally, runs
  ``colmap image_undistorter``, and emits a PINHOLE
  ``colmap-cameras-txt`` and undistorted ``frame_sequence``.
source_entry: undistort.py
category: "reconstruction/colmap"

docs: |
  ### Reassembly step

  The script's first act is ``reassemble_cameras_txt``: it reads the
  PINHOLE cameras.txt (fx fy cx cy) and the distortion JSON
  (model + remaining params) and writes a full OPENCV cameras.txt to
  the scratch prior. Only that assembled file is passed to
  ``colmap image_undistorter`` — the undistorter sees the original
  distortion model as if split had never happened.

  ### Identity-pose prior

  Undistortion is purely intrinsic: the per-pixel remap depends only
  on the camera model, not on the extrinsics. This pack synthesises an
  identity ``images.txt`` (QW=1, rest 0, TX=TY=TZ=0) so the prior is
  valid COLMAP text without real poses. The resulting PINHOLE
  cameras.txt and undistorted images are bit-identical to what a prior
  with real poses would produce.

  ### Fan-out contract (scalar broadcast into arrayed shard)

  ``arrayable: true``. Under ``arrayed_toggle=true`` the framework zips
  ``pinhole_intrinsics``, ``distortion``, and ``images`` by element_id
  via ``hololab/gateway/execution.py::_discover_element_ids``. When
  the split outputs are **scalar** (one shared camera model across all
  frames), the framework broadcasts them to every shard automatically —
  no ``arrayfy`` node needed.

arrayable: true

inputs:
  pinhole_intrinsics:
    tags: [colmap-cameras-txt]
    description: "PINHOLE cameras.txt from colmap-split@0.2.0 (intrinsics only)."
    arrayed: false
  distortion:
    tags: [camera-distortion-json]
    description: "Distortion JSON from colmap-split@0.2.0 (model + coefficients)."
    arrayed: false
  images:
    tags: [frame_sequence]
    description: "Per-cam distorted frames to undistort."
    arrayed: false

params:
  blank_pixels:
    type: int
    default: 0
    min: 0
    max: 1
    description: >
      Pass-through to ``image_undistorter --blank_pixels``. 0 crops invalid
      regions; 1 keeps original size and fills with black.

outputs:
  cameras:
    tags: [colmap-cameras-txt]
    description: "PINHOLE cameras.txt from image_undistorter (adjusted for crop)."
  undistorted:
    tags: [frame_sequence]
    description: "Undistorted images at PINHOLE resolution."

runtime:
  env: kiri
  gpu:
    required: false

exec:
  shell: |
    set -euo pipefail
    python "{{ pack_dir }}/undistort.py" \
      --pinhole-intrinsics "{{ inputs.pinhole_intrinsics }}" \
      --distortion "{{ inputs.distortion }}" \
      --images "{{ inputs.images }}" \
      --cameras-out "{{ outputs.cameras }}" \
      --undistorted-out "{{ outputs.undistorted }}" \
      --scratch "{{ scratch_dir }}" \
      --blank-pixels {{ params.blank_pixels }}

idempotency:
  marker: "{{ outputs.cameras }}/.hololab-done"
