apiVersion: hololab.dev/v1
kind: Algorithm
name: preview
version: 0.1.0
description: >
  Zero-copy generic passthrough for exposing any one artifact through a
  single-output preview drawer.
category: "utility/preview"
arrayable: true

docs: |
  Use this node when a producer has several outputs and the canvas drawer can
  only open one of them. Wire the artifact to ``in``; ``out`` is a directory
  of symlinks to the same entries, so no payload bytes are copied or
  transformed.

  ``out`` inherits the connected input's tags and dimension labels. For a
  scalar artifact (for example ``rig_timeline``), leave the node's *arrayed*
  switch off. For an arrayed artifact (including ``groups[group,cam]``), turn
  it on. ``content_dims=1`` means the innermost semantic dimension is image
  content (files), not another directory fan-out layer; this is the correct
  default for ``image[group,cam]``. Set it to 0 for a generic two-level
  directory tree.

  The idempotency marker lives inside the new output directory, never in the
  linked source artifact. Thus previewing cannot mutate or pollute the source.

inputs:
  in:
    tags: [any]
    # The validator needs two semantic dimensions before it can inspect a wire;
    # dim_labels_from_input is output-only, so it cannot supply this later.
    # Empty labels are wildcards. content_dims controls how many innermost
    # dimensions are files rather than physical directory layers.
    dim_labels: ["", ""]
    content_dims_from: content_dims
    description: "Any scalar T, or any 2-D arrayed<arrayed<T>> when arrayed is on."

params:
  content_dims:
    type: int
    default: 1
    min: 0
    max: 1
    description: >
      Number of innermost input dimensions represented by tag content rather
      than directories. Default 1 preserves image[group,cam] as group dirs
      containing image files; use 0 when both dimensions are directories.

outputs:
  out:
    tags: [any]
    tags_from: in
    dim_labels_from_input: in
    dim_labels_drop_outer: 0
    description: "The same artifact as ``in`` (zero-copy symlink)."

runtime:
  env: kiri
  gpu:
    required: false
  expected_duration_min: [0.01, 0.02]

exec:
  shell: |
    set -euo pipefail
    # Build an output-owned shallow symlink tree. This leaves the source
    # artifact untouched while placing the completion marker inside out.
    rm -rf "{{ outputs.out }}"
    mkdir -p "{{ outputs.out }}"
    while IFS= read -r -d '' ENTRY; do
      ln -s "$(readlink -f "{{ inputs.in }}/$ENTRY")" "{{ outputs.out }}/$ENTRY"
    done < <(find "{{ inputs.in }}" -mindepth 1 -maxdepth 1 \
      ! -name '.hololab-done' -printf '%f\0')
    touch "{{ outputs.out }}/.hololab-done"
    # Fan-out shards write under <parent>/out/<element>; mark the aggregate
    # root too. Concurrent touches are harmless.
    touch "$(dirname "{{ outputs.out }}")/.hololab-done"

idempotency:
  marker: "{{ outputs.out }}/.hololab-done"
