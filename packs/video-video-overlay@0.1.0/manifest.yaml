apiVersion: hololab.dev/v1
kind: Algorithm
name: community/video-video-overlay
version: 0.1.0
description: Overlay one video on another video with proportional scaling and nine positions.
category: basic/editing
source_entry: run.py
docs: |-
  Connect a main video to video and a picture-in-picture video to overlay.
  The overlay starts from its first frame at start_seconds and disappears at its EOF or window end, whichever comes first.
  No looping or frozen final frame; main video duration and timestamps are preserved. Both audio streams are discarded.
  Requires sibling video-image-overlay@0.1.0: run.py imports its shared _overlay.py and _media.py.
  Window is [start_seconds, end_seconds): end overrides duration_seconds; otherwise start + duration is used.
  Omit both end and duration for the remainder of the main video (legacy default). The output is never trimmed.
  Optional offset_x_ratio / offset_y_ratio override each position axis independently: top-left coordinate as a fraction of frame width/height, clamped inside margins.
  width_ratio sets the target fraction of video width; aspect-preserving scaling also fits inside both pixel margins.
  margin is pixels on each edge; impossible margins are rejected. opacity multiplies existing image alpha.
  CPU-only, two encoder/filter threads. Requires ffmpeg/ffprobe with libx264 in logical environment kiri. Outputs silent video: audio is intentionally discarded. H.264/yuv420p, CRF 20, faststart; odd dimensions are padded to even. Input clips are never modified.
inputs:
  video:
    tags:
    - video-source
    storage: dir
  overlay:
    tags:
    - video-source
    storage: dir
    description: Picture-in-picture video, played from its beginning at start_seconds.
params:
  start_seconds:
    type: float
    default: 0
    min: 0
  end_seconds:
    type: float
    optional: true
    description: Exclusive window end; overrides duration_seconds. Must exceed start_seconds.
  duration_seconds:
    type: float
    optional: true
    min: 0.001
    description: Positive window duration when end is absent; omit both for the remainder of the video.
  offset_x_ratio:
    type: float
    optional: true
    min: 0
    max: 1
    description: Left edge as a fraction of frame width; overrides horizontal position and clamps inside margins.
  offset_y_ratio:
    type: float
    optional: true
    min: 0
    max: 1
    description: Top edge as a fraction of frame height; overrides vertical position and clamps inside margins.
  position:
    type: enum
    default: top-right
    values:
    - top-left
    - top-center
    - top-right
    - middle-left
    - middle-center
    - middle-right
    - bottom-left
    - bottom-center
    - bottom-right
  width_ratio:
    type: float
    default: 0.25
    min: 0.001
    max: 1
    description: Target fraction of video width; further reduced to fit within margins.
  margin:
    type: int
    default: 20
    min: 0
    description: Inset in pixels from each edge, before odd-dimension padding.
  opacity:
    type: float
    default: 1
    min: 0
    max: 1
    description: Multiply image alpha (0 transparent, 1 original opacity).
outputs:
  video:
    tags:
    - video-source
    storage: dir
    description: One silent H.264/yuv420p MP4 (output.mp4), ready for browser preview.
runtime:
  env: kiri
  gpu:
    required: false
  resources:
    scratch_gb: 2
    mem_gb: 2
exec:
  shell: |
    set -euo pipefail
    python "{{ pack_dir }}/run.py" <<'HOLOLAB_VIDEO_CONFIG'
    {{ {'inputs': inputs, 'outputs': outputs, 'params': params} | tojson }}
    HOLOLAB_VIDEO_CONFIG
progress:
  stdout_regex: \[ITER (\d+)/(\d+)\]
