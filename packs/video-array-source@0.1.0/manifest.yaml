apiVersion: hololab.dev/v1
kind: Algorithm
name: video-array-source
version: 0.1.0
description: "Data-source node — points at a DIRECTORY of videos (multi-clip / multi-camera) to feed the SfM+STG chain. Does NOT extract frames."
category: "source/video"
docs: |
  Data-source node for a **multi-clip / multi-camera capture** — a
  directory containing one or more video files, each typically a
  distinct camera. Symlinks each video into a handle so downstream
  reconstruction packs can read them without copying bytes; it does
  **NOT** extract frames — frame extraction happens downstream in
  the SfM step (``video-to-camera-track`` / ``video-to-colmap``),
  which decodes the video into per-frame images as part of its own
  workspace.

  - **Param:** `video_dir` — absolute path to a directory containing
    ``.mp4`` / ``.mov`` / ``.mkv`` / ``.webm`` / ``.avi`` files.
  - **Output:** ``videos_dir`` is an ``arrayed<video-source>`` handle —
    one subdirectory per source video, each subdir named after the
    video's basename (extension stripped) so element ids read cleanly
    (``camera_A``, ``camera_B``, ...). The video symlink lives INSIDE
    that subdir under its original basename, so each element on its own
    looks like a scalar ``video-source`` (a directory containing a
    video file). This is the arrayed<T> layout the framework's fan-out
    expects — see docs/pack-spec.md#arrayed-and-arrayable.
  - **Output tag:** ``video-source`` with ``arrayed: true`` (M7
    migration; the pre-arrayed ``video-source-array`` string tag has
    been retired — same semantics, expressed via the type system's
    cardinality flag instead).
  - Dotfiles are skipped; the pack fails fast if no matching video
    file is found in the directory.

  When to use vs ``single-video-source``:

  - Single monocular video (one camera, one clip) →
    ``single-video-source``.
  - Multi-camera capture or multi-clip inputs (directory of videos,
    each a different camera or take) → this pack.

  Downstream ``frame-extraction`` is now ``arrayable: true``; check the
  "并行处理数组输入" box on that node and the scheduler dispatches one
  shard per camera, producing an ``arrayed<frame_sequence>`` output
  ready for ``regroup-by-frame`` / ``colmap-triangulate``.

  Preview: derived from the ``video-source`` tag via the gateway's
  tag→viewer registry (video-grid renders one tile per element).
  See docs/pack-spec.md § "tag-driven preview inference".

params:
  video_dir:
    type: string
    description: "Absolute path to a directory containing one or more video files."

outputs:
  videos_dir:
    tags: [video-source]
    arrayed: true
    dim_labels: ["cam"]
    description: >
      arrayed<video-source> — one subdirectory per source video, subdir
      named after the video's stem, containing the video symlink under
      its original basename. Outer dim = per-camera (one clip per rig
      camera); handle summary reports ``dim_sizes=[N_cam]``.

runtime:
  env: kiri
  gpu:
    required: false
  expected_duration_min: [0.01, 0.05]
  resources:
    # Symlink-only pack; no real disk or memory pressure. Values are
    # generous rounding so the preflight never blocks this pack.
    scratch_gb: 0.1
    mem_gb: 0.5

exec:
  # M7: arrayed<video-source> layout — enumerate video files at depth 1,
  # sort by basename for deterministic ordering, and place each in its own
  # element subdirectory named after the video's stem (extension stripped).
  # Each element subdir carries the video symlink under its original
  # basename, so a downstream arrayable ``frame-extraction`` shard sees a
  # scalar ``video-source`` (dir-of-videos) shape identical to what
  # ``single-video-source`` produces.
  shell: |
    set -euo pipefail
    OUT="{{ outputs.videos_dir }}"
    mkdir -p "$OUT"
    VDIR="{{ params.video_dir }}"

    if [ ! -d "$VDIR" ]; then
      echo "video_dir not found or not a directory: $VDIR" >&2
      exit 2
    fi

    COUNT=0
    while IFS= read -r -d '' F; do
      BASE=$(basename "$F")
      case "$BASE" in
        .*) continue ;;
      esac
      STEM="${BASE%.*}"          # camera_A.mp4 → camera_A  (element_id)
      mkdir -p "$OUT/$STEM"
      ln -sf "$F" "$OUT/$STEM/$BASE"
      COUNT=$((COUNT + 1))
    done < <(find "$VDIR" -maxdepth 1 \( -type f -o -type l \) \
              \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.mkv' \
                 -o -iname '*.webm' -o -iname '*.avi' \) -print0 | sort -z)
    if [ "$COUNT" -eq 0 ]; then
      echo "no video files (.mp4/.mov/.mkv/.webm/.avi) found in $VDIR" >&2
      exit 2
    fi
    echo "[ITER 1/1] arrayed $COUNT video(s) into element subdirs of $OUT"

idempotency:
  marker: "{{ outputs.videos_dir }}/.hololab-done"

progress:
  stdout_regex: '\[ITER (\d+)/(\d+)\]'
