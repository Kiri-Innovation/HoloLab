apiVersion: hololab.dev/v1
kind: Algorithm
name: person-gray-mask
version: 0.1.0
description: Gray-wall foreground extraction with adaptive Lab color seeds and GrabCut. Validates every image stem and size; white means valid RGB loss.
source_entry: mask.py
category: generation/other
inputs:
  colmap:
    tags: [colmap-folder]
outputs:
  masks:
    tags: [mask, image]
    arrayed: true
    storage: dir
    dim_labels: [frame]
    description: >-
      arrayed<mask>[frame], sorted by filename. The image co-tag declares
      the existing single-image file contract for every mask leaf.
      The aggregate is a directory;
      each element is one file named <image-stem>.png (storage: file),
      decoded as single-channel uint8 at the source image width and height.
      Values are 0 (background) or 255 (foreground / valid RGB loss).
      Validated before success: nonempty inputs, unique stems, exact PNG
      filename coverage, matching image dimensions, binary values, and
      foreground coverage strictly between 5% and 95%. Hidden .done is
      an execution marker, not an array element.
  report:
    tags: [directory]
runtime:
  env: fastgs
  gpu:
    required: false
exec:
  shell: >-
    python "{{ pack_dir }}/mask.py" --colmap "{{ inputs.colmap }}"
    --output "{{ outputs.masks }}" --report "{{ outputs.report }}"
previews:
  - id: samples
    type: grid
    glob: "{{ outputs.report }}/sample_*.png"
idempotency:
  marker: "{{ outputs.masks }}/.done"
