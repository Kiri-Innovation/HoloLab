apiVersion: hololab.dev/v1
kind: Algorithm
name: colmap-split
version: 0.1.0
description: >
  Explode a ``colmap-cams`` handle into two independently-wire-able
  COLMAP-native text files: ``cameras.txt`` (the full camera model,
  intrinsics + distortion together per COLMAP's schema) and
  ``images.txt`` (per-image poses, with 2D observation lines left empty).
  Every downstream consumer stays inside the COLMAP text format — no
  intermediate JSON, no proprietary schema.
source_entry: split.py
category: "reconstruction/colmap"

docs: |
  The interchange format across this repo's colmap-* packs is
  **COLMAP-native text**. That's what ``colmap`` itself reads and
  writes; keeping the split's outputs in that format means every
  file can be spot-checked with ``colmap model_converter`` or dropped
  into any COLMAP-aware tool without a bespoke reader.

  ### Why not split intrinsics away from distortion?

  COLMAP's ``cameras.txt`` line **is** the camera model: e.g.
  ``1 OPENCV 2704 2028 fx fy cx cy k1 k2 p1 p2`` packs the pinhole part
  and the distortion coefficients into one row because the OPENCV model
  is that whole thing. Splitting them further would invent a schema that
  no COLMAP tool understands. If you need the two pieces logically
  separated on the canvas, do it visually — but the on-disk bytes stay
  COLMAP-textual.

  ### Output tags

  * ``colmap-cameras-txt`` — a handle whose payload is one file,
    ``cameras.txt``, byte-equal to the input's ``cameras.txt``.
  * ``colmap-images-txt`` — a handle whose payload is one file,
    ``images.txt``. Format is standard COLMAP: for each image, one
    header line ``IMAGE_ID QW QX QY QZ TX TY TZ CAMERA_ID NAME``
    followed by an empty observations line. **We drop the 2D
    observations** — this is a poses-only view; if you need the
    full point tracks, wire the ``colmap-cams`` handle directly.

  ### Fan-out

  ``arrayable: true`` — an ``arrayed<colmap-cams>`` fans out one
  shard per element and the framework aggregates the two scalar
  outputs back into ``arrayed<colmap-cameras-txt>`` +
  ``arrayed<colmap-images-txt>``.

arrayable: true

inputs:
  cams:
    tags: [colmap-cams]
    description: "A colmap-cams handle (cameras.txt + images.txt)."

outputs:
  cameras:
    tags: [colmap-cameras-txt]
    description: "Full camera model in COLMAP text format (cameras.txt, unchanged)."
  poses:
    tags: [colmap-images-txt]
    description: "Per-image poses in COLMAP text format (images.txt, 2D observations stripped)."

runtime:
  env: kiri
  gpu:
    required: false

exec:
  shell: |
    set -euo pipefail
    python "{{ pack_dir }}/split.py" \
      --cams "{{ inputs.cams }}" \
      --cameras-out "{{ outputs.cameras }}" \
      --poses-out "{{ outputs.poses }}"

idempotency:
  marker: "{{ outputs.cameras }}/.hololab-done"
