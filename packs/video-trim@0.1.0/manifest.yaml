apiVersion: hololab.dev/v1
kind: Algorithm
name: community/video-trim
version: 0.1.0
description: Trim a video by start and end time, or duration, in seconds.
category: basic/editing
source_entry: run.py
docs: |-
  Keeps [start_seconds, end_seconds). Optional end_seconds takes precedence over duration_seconds, including saved/default duration values; it must be greater than start_seconds.
  Omit end_seconds (or set it to null) to use duration_seconds (default 5 seconds). start_seconds defaults to 0.
  Accurate re-encoded trim; requests past the end stop at the last frame.
  CPU-only, two encoder/filter threads. Requires ffmpeg/ffprobe with libx264 in logical environment kiri. Outputs silent video: audio is intentionally discarded. H.264/yuv420p, CRF 20, faststart; odd dimensions are padded to even. Input clips are never modified.
inputs:
  video:
    tags:
    - video-source
    storage: dir
params:
  start_seconds:
    type: float
    default: 0
    min: 0
  duration_seconds:
    type: float
    default: 5
    min: 0.001
  end_seconds:
    type: float
    optional: true
    description: Exclusive end time in seconds; overrides duration_seconds when set. Must exceed start_seconds.
outputs:
  video:
    tags:
    - video-source
    storage: dir
    description: One silent H.264/yuv420p MP4 (output.mp4), ready for browser preview.
requires:
  packages: [ffmpeg]
runtime:
  env: kiri
  gpu:
    required: false
  resources:
    scratch_gb: 2
    mem_gb: 2
exec:
  shell: |
    set -euo pipefail
    python "{{ pack_dir }}/run.py" <<'HOLOLAB_VIDEO_CONFIG'
    {{ {'inputs': inputs, 'outputs': outputs, 'params': params} | tojson }}
    HOLOLAB_VIDEO_CONFIG
progress:
  stdout_regex: \[ITER (\d+)/(\d+)\]
