apiVersion: hololab.dev/v1
kind: Algorithm
name: flatten-image-groups
version: 0.1.0
description: "Flatten arrayed[group,cam]<image> into a physical one-dimensional image array."
source_entry: flatten_image_groups.py
category: "utility/arrayed"

docs: |
  Converts `<group>/<image>` into one root-level image element named
  `<group>__<image>`. A slash cannot be retained in a genuinely one-dimensional
  HoloLab image array because every directory layer is a collection axis.

  The output therefore uses names such as `g000094__cam0.jpg`. The reversible
  mapping is also recorded in hidden `.flatten-image-groups/manifest.json` for
  auditing, but downstream typing and enumeration see only the root-level files.
  Group identity is now a checked filename convention rather than a type axis.

inputs:
  images:
    tags: [image]
    arrayed: true
    storage: dir
    dim_labels: [group, cam]

outputs:
  images:
    tags: [image]
    arrayed: true
    storage: dir

runtime:
  env: kiri
  gpu:
    required: false

exec:
  shell: |
    set -euo pipefail
    python "{{ pack_dir }}/flatten_image_groups.py" \
      --input "{{ inputs.images }}" \
      --output "{{ outputs.images }}"

idempotency:
  marker: "{{ outputs.images }}/.hololab-done"
