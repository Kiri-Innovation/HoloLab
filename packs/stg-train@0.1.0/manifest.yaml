apiVersion: hololab.dev/v1
kind: Algorithm
name: stg-train
version: 0.1.0
description: "Train a SpacetimeGaussians 4D Gaussian model from a COLMAP directory."
category: "training/spacetime-gaussians"
source_entry: SpacetimeGaussians/train.py
docs: |
  Trains a SpacetimeGaussians 4D Gaussian model on a COLMAP-shaped
  dataset produced by the A3 multi-view render.

  - **Input:** `colmap_dir` container; STG reads the `colmap_<start_time>`
    subdir. Optional `flow_dir` enables Track4World flow-based init.
  - **Output:** `model_dir` — `point_cloud/iteration_N/point_cloud.ply`
    plus `save_cam/` preview thumbs.
  - `iterations` is the main knob: ~500 for smoke, 25000+ for production.
    `duration` = number of frames; `data_device: cpu` keeps VRAM free for
    the model on smaller GPUs; keep `lazy_load_images: true`.
  - `stg_repo` is required (machine-specific — no default on purpose).
  - Expensive (5–240 min); needs ≥12 GiB VRAM.

inputs:
  colmap_dir:
    tags: [colmap, sharp4dgs_export]
    description: "Container directory holding one or more ``colmap_<N>`` subdirectories, as produced by gsseq_to_multiview. STG loads the ``colmap_<start_time>`` subdir named by the ``start_time`` param."

  flow_dir:
    tags: [t4w_flow]
    description: "Optional Track4World 3d_ff_output directory for flow-based init."
    required: false

params:
  iterations:
    type: int
    default: 500
    min: 1
    description: "Total training iterations. 30000 for full runs; a few hundred for smoke."

  duration:
    type: int
    default: 49
    min: 1
    description: "Number of frames to load from the COLMAP directory."

  batch:
    type: int
    default: 2
    min: 1

  save_cam:
    type: int
    default: 5
    description: "Every N iterations, dump a save_cam preview frame."

  prune_z_min:
    type: float
    default: 1.0
    description: "Near-plane prune. Set to a very small value for close-up scenes."

  raystart:
    type: float
    default: 0.7

  configpath:
    type: string
    default: "configs/n3d_full/sharp4dgs_export.json"
    description: "Path to STG config JSON, resolved relative to STG_REPO."

  start_time:
    type: int
    default: 0
    min: 0
    description: "Which ``colmap_<N>`` subdirectory of the input to train on (start-time index)."

  stg_repo:
    type: string
    description: "Absolute path to the SpacetimeGaussians repo on the executing node. Required; the manifest deliberately has no default because this is machine-specific — move it to node config once we support extra resource maps."

  lazy_load_images:
    type: bool
    default: true
    description: "Pass --lazy-load-images to STG so a 24 GiB GPU doesn't OOM when eagerly loading all training frames."

  data_device:
    type: enum
    values: [cuda, cpu]
    default: cpu
    description: "Where STG puts the loaded frames. `cpu` keeps VRAM free for the model at the cost of some throughput."

outputs:
  model_dir:
    tags: [stg_model, splatv]
    description: "Trained STG model directory containing iteration_N.splatv and save_cam."

runtime:
  env: kiri
  gpu:
    required: true
    vram_gb_min: 12
  expected_duration_min: [5, 240]
  resources:
    # Empirical baseline @ default iterations=500, duration=49:
    #   * scratch ~ 3 GiB (checkpoints + save_cam thumbs). Full 30k iter
    #     runs peak closer to 8 GiB.
    #   * host RAM peak ~ 10 GiB (dataset staging + optim state).
    #   * VRAM peak ~ 16 GiB (STG is the VRAM-heaviest pack).
    scratch_gb: 8.0
    mem_gb: 12.0
    gpu_mem_gb: 16.0

exec:
  # NB: SpacetimeGaussians expects to be invoked from its own repo root so its
  # relative --configpath resolves. We pass --iterations, --save_iterations,
  # and --test_iterations at the end to override JSON.
  shell: |
    set -euo pipefail
    cd "{{ params.stg_repo }}"
    ulimit -n 65536 || true
    LAZY_FLAG=""
    if [ "{{ params.lazy_load_images }}" = "True" ] || [ "{{ params.lazy_load_images }}" = "true" ]; then
      LAZY_FLAG="--lazy-load-images"
    fi
    # STG's dataset reader requires --source_path to end in ``colmap_<N>``.
    # The upstream pack (video-to-colmap) puts one or more such subdirs
    # inside its output container; we pick the one matching start_time.
    SOURCE="{{ inputs.colmap_dir }}/colmap_{{ params.start_time }}"
    if [ ! -d "$SOURCE" ]; then
      echo "expected colmap subdir not found: $SOURCE" >&2
      exit 2
    fi
    python train.py \
      --quiet \
      --eval \
      --configpath "{{ params.configpath }}" \
      --source_path "$SOURCE" \
      --model_path "{{ outputs.model_dir }}" \
      --duration {{ params.duration }} \
      --batch {{ params.batch }} \
      --save_cam {{ params.save_cam }} \
      --prune_z_min={{ params.prune_z_min }} \
      --raystart={{ params.raystart }} \
      --data_device {{ params.data_device }} \
      --iterations {{ params.iterations }} \
      --save_iterations {{ params.iterations }} \
      --test_iterations {{ params.iterations }} \
      $LAZY_FLAG
  working_dir: "{{ params.stg_repo }}"

idempotency:
  marker: "{{ outputs.model_dir }}/.hololab-done"

progress:
  # STG's train.py prints "[ITER 100] Loss ..." style lines.
  stdout_regex: '\[ITER (\d+)\]'

previews:
  - id: save_cam_thumbs
    type: grid
    glob: "{{ outputs.model_dir }}/save_cam/*.png"

  - id: exp_log
    type: log
    path: "{{ outputs.model_dir }}/exp_log.txt"
