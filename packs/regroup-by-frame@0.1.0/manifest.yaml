apiVersion: hololab.dev/v1
kind: Algorithm
name: regroup-by-frame
version: 0.1.0
description: >
  **DEPRECATED** — kept for snapshot replay of existing workflows. New
  workflows should use ``regroup@0.2.0`` (generic N-D dim permutation
  with ``<dim_label>_<idx:04d>`` naming, no source-stem echo).
  Transposes ``arrayed<frame_sequence>`` from (camera x frame) to
  (frame x camera) at the file level, echoing source filename stems as
  element ids.
source_entry: regroup.py
category: "utility/arrayed"

docs: |
  Input layout (arrayed<frame_sequence>, one element per camera):
  ```
  <input>/
    cam_A/
      frames/
        frame_000000.png
        frame_000001.png
    cam_B/
      frames/
        frame_000000.png
        ...
  ```

  Output layout (arrayed<frame_sequence>, one element per frame):
  ```
  <output>/
    frame_000000/
      frames/
        cam_A.png
        cam_B.png
    frame_000001/
      frames/
        ...
  ```

  Element ids on both sides are the sorted subdir names. Symlinks
  (not copies) — no disk-copy overhead even at 21 cameras × 400 frames.

  Whole-array operation (not per-shard) — pack is NOT arrayable; the
  framework hands the arrayed handle path in as-is, the pack does the
  transpose in one process.

inputs:
  by_cam:
    tags: [image]
    arrayed: true
    # Aggregate = arrayed<image_sequence>: outer subdir = per-camera, inner
    # content = per-frame (files under each cam's ``frames/``). Summary
    # reports ``dim_sizes=[N_cam, N_frame]``.
    dim_labels: ["cam", "frame"]
    description: "arrayed<image_sequence>: each element = one camera's frames."

outputs:
  by_frame:
    tags: [image]
    arrayed: true
    # Transposed: outer subdir = per-frame, inner content = per-camera
    # (files under each frame's ``frames/``). Summary reports
    # ``dim_sizes=[N_frame, N_cam]``.
    dim_labels: ["frame", "cam"]
    description: "arrayed<image_sequence>: each element = one frame's cameras."

runtime:
  env: kiri
  gpu:
    required: false

exec:
  shell: |
    set -euo pipefail
    python "{{ pack_dir }}/regroup.py" \
      --input "{{ inputs.by_cam }}" \
      --output "{{ outputs.by_frame }}"
