apiVersion: hololab.dev/v1
kind: Algorithm
name: image-to-video
version: 0.1.0
description: Convert one still image to a silent video.
category: basic/editing
source_entry: run.py
docs: |-
  One image file becomes a still clip. Native image size, padded to even; no resizing. duration_seconds defaults to 3, fps to 30. Duration rounds up to a whole output frame.
  CPU-only, two encoder/filter threads, env kiri. Silent H.264/yuv420p, CRF 20, faststart. Input media is never modified.
inputs:
  image:
    tags:
    - image
    storage: file
params:
  duration_seconds:
    type: float
    default: 3
    min: 0.001
  fps:
    type: float
    default: 30
    min: 0.001
    max: 240
outputs:
  video:
    tags:
    - video-source
    storage: dir
    description: One silent H.264/yuv420p MP4 (output.mp4), ready for browser preview.
runtime:
  env: kiri
  gpu:
    required: false
  resources:
    scratch_gb: 2
    mem_gb: 2
exec:
  shell: |
    set -euo pipefail
    python "{{ pack_dir }}/run.py" <<'HOLOLAB_VIDEO_CONFIG'
    {{ {'inputs': inputs, 'outputs': outputs, 'params': params} | tojson }}
    HOLOLAB_VIDEO_CONFIG
progress:
  stdout_regex: \[ITER (\d+)/(\d+)\]
