apiVersion: hololab.dev/v1
kind: Algorithm
name: float-array-source
version: 0.1.0
description: Produce ID-aligned float attributes for compose-video.
category: source/array
source_entry: run.py
docs: |-
  items is a native array of finite offsets >= 0 in seconds.
  ids is an optional string array. Leave empty when videos is connected to bind lexically sorted video IDs; otherwise provide one explicit ID per layer. Duplicate IDs and count mismatches are rejected.
  Legacy JSON-string items remain accepted at execution and are converted when edited in Inspector.
  CPU-only, env kiri. Uses a fresh empty output directory; validates before publishing. No ASE parameter binding or dynamic input ports.
inputs:
  videos:
    tags:
    - video-source
    storage: dir
    arrayed: true
    dim_labels:
    - layer
    required: false
    require_axis_label_match: false
params:
  ids:
    type: array
    items: string
    default: []
    description: Optional explicit layer IDs; leave empty to use the connected videos order.
  items:
    type: array
    items: float
    default: []
    min: 0
    description: Offsets in seconds, one per video layer.
outputs:
  offsets:
    tags:
    - float
    storage: dir
    arrayed: true
    dim_labels:
    - layer
runtime:
  env: kiri
  gpu:
    required: false
  resources:
    scratch_gb: 0.1
    mem_gb: 0.5
exec:
  shell: |
    set -euo pipefail
    python "{{ pack_dir }}/run.py" <<'HOLOLAB_ARRAY_CONFIG'
    {{ {'inputs': inputs, 'outputs': outputs, 'params': params} | tojson }}
    HOLOLAB_ARRAY_CONFIG
progress:
  stdout_regex: \[ITER (\d+)/(\d+)\]
