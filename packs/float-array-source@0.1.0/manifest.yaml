apiVersion: hololab.dev/v1
kind: Algorithm
name: float-array-source
version: 0.1.0
description: Initialize ordered float attributes for compose-video.
category: source/array
source_entry: run.py
docs: |-
  items is a native array of finite offsets >= 0 in seconds.
  Pure initialization: no input ports or IDs. Values are emitted in parameter order as 0000, 0001, ... (padding grows uniformly beyond 9999).
  compose-video pairs arrays by position, not by filename. Supply exactly one value per video layer.
  Legacy JSON-string items without IDs remain accepted by standalone execution.
  CPU-only, env kiri. Uses a fresh empty output directory; validates before publishing. No ASE parameter binding or dynamic input ports.
inputs: {}
params:
  items:
    type: array
    items: float
    default: []
    min: 0
    description: Offsets in seconds, one per video layer.
outputs:
  offsets:
    tags:
    - float
    storage: dir
    arrayed: true
    dim_labels:
    - layer
runtime:
  env: kiri
  gpu:
    required: false
  resources:
    scratch_gb: 0.1
    mem_gb: 0.5
exec:
  shell: |
    set -euo pipefail
    python "{{ pack_dir }}/run.py" <<'HOLOLAB_ARRAY_CONFIG'
    {{ {'inputs': inputs, 'outputs': outputs, 'params': params} | tojson }}
    HOLOLAB_ARRAY_CONFIG
progress:
  stdout_regex: \[ITER (\d+)/(\d+)\]
