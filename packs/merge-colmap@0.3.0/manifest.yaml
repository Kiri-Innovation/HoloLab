apiVersion: hololab.dev/v1
kind: Algorithm
name: merge-colmap
version: 0.3.0
description: >
  Per-frame ``colmap-folder`` assembly with all three inputs treated as
  fan-out participants — ``cams`` moves from ``scalar`` (0.2.0) to a
  regular arrayed driver so the pack can consume per-frame PINHOLE
  bundles from ``image-undistort@0.4.0``. Framework aggregates N shards
  into ``arrayed<colmap-folder>[frame]``.
source_entry: merge.py
category: "reconstruction/colmap"

docs: |
  ### v0.3.0 vs v0.2.0

  ``@0.2.0`` had ``cams: scalar: true`` (broadcast) because sfm's cams
  bundle is the same for every frame. That still works if you're
  running merge on ``sfm.cams`` directly. But once we insert
  ``image-undistort@0.4.0`` upstream — the new canonical chain per user
  design — the cams bundle turns PER-FRAME (each shard's PINHOLE bundle
  is emitted as one element of an ``arrayed<colmap-cams>[frame]``
  aggregate). ``@0.3.0`` accepts that aggregate directly: ``cams`` is
  a fan-out participant zipped by ``frame_XXXX`` element_id alongside
  ``points`` and ``images``.

  The PINHOLE bundles produced by ``image-undistort@0.4.0`` are
  bit-identical across shards (undistortion is intrinsic-only, and the
  intrinsic + poses come from the scalar SfM broadcast at the und step)
  — so wiring the aggregate here vs. picking element 0 with ``get-index``
  and treating it as scalar is semantically equivalent. The aggregate
  wire is chosen because it keeps element_id parity across all three
  drivers, which the framework's ``_discover_element_ids`` prefers.

  ### Inputs

  * ``cams``   — fan-out participant, ``arrayed<colmap-cams>[frame]``
                 aggregate. Each shard sees one per-frame PINHOLE bundle.
  * ``points`` — fan-out participant, ``arrayed<point-cloud>[frame]``.
                 Each shard sees one per-frame point cloud.
  * ``images`` — **optional** fan-out participant,
                 ``arrayed<image>[frame]``. Wire for Mode B (with
                 ``images/`` in the output); leave unwired for Mode A
                 (sparse-only). Should typically be wired to the same
                 und's ``images`` output so files match cams' images.txt
                 NAMEs.

  ### Outputs

  ``folder`` — per-shard ``colmap-folder``; scalar per invocation,
  wrap-dim ``["frame"]``; framework aggregates into
  ``arrayed<colmap-folder>[frame]``. Tag list ``[colmap-folder, colmap]``
  keeps the legacy-tag consumer (``stg-train@0.2.0.colmap_frames``)
  edge-compatible without a manifest bump on its side.

  ### NAME rewrite (same as 0.2.0)

  The script rewrites images.txt NAMEs to flat basenames matching the
  actual per-cam files under ``images/``. Not strictly required when
  cams comes from ``image-undistort@0.4.0`` (that pack already
  rewrites NAMEs), but the code path is preserved so this pack still
  works when cams comes straight from SfM.

arrayable: true

inputs:
  cams:
    tags: [colmap-cams]
    dim_labels: ["frame"]
    description: >
      Per-frame ``colmap-cams`` bundle (typically PINHOLE from
      ``image-undistort@0.4.0``). Aggregate handle is
      ``arrayed<colmap-cams>[frame]``; each shard sees one bundle.
  points:
    tags: [point-cloud]
    description: >
      Per-frame ``point-cloud``. Aggregate handle is
      ``arrayed<point-cloud>[frame]``; each shard sees one frame's
      ``points3D.txt``.
  images:
    tags: [image]
    required: false
    dim_labels: ["frame"]
    description: >
      Optional per-frame images. Aggregate handle is
      ``arrayed<image>[frame]``; each shard's element dir holds the
      cam-side image files inline. Wire for Mode B.

outputs:
  folder:
    tags: [colmap-folder, colmap]
    scalar: true
    dim_labels: ["frame"]
    description: >
      Per-frame ``colmap-folder``. Framework aggregates into
      ``arrayed<colmap-folder>[frame]``. Compat ``colmap`` alias
      keeps ``stg-train@0.2.0.colmap_frames`` edge-accepted.

runtime:
  env: kiri
  gpu:
    required: false

exec:
  shell: |
    set -euo pipefail
    {% if 'images' in inputs %}
    python "{{ pack_dir }}/merge.py" \
      --cams "{{ inputs.cams }}" \
      --points "{{ inputs.points }}" \
      --images "{{ inputs.images }}" \
      --out "{{ outputs.folder }}"
    {% else %}
    python "{{ pack_dir }}/merge.py" \
      --cams "{{ inputs.cams }}" \
      --points "{{ inputs.points }}" \
      --out "{{ outputs.folder }}"
    {% endif %}

idempotency:
  marker: "{{ outputs.folder }}/.hololab-done"
