apiVersion: hololab.dev/v1
kind: Algorithm
name: video-to-colmap
version: 0.1.0
description: "Single video -> per-frame Sharp-4DGS reconstruction + multi-view COLMAP export."
source_entry: ../../../sharp-4dgs/per-frame/video_to_3d.py
category: "reconstruction/pipeline"
docs: |
  **Composite pipeline**: runs A1 (MegaSaM track) + A2 (Sharp per-frame)
  + A3 (multi-view render) in a single job, ending with a COLMAP-shaped
  directory ready for `stg-train`.

  - **Input:** `video_dir` from either ``single-video-source`` (tag
    ``video-source``) or ``video-array-source`` (tag
    ``video-source-array``).
  - **Output:** `colmap_dir` with `colmap_0/`, `colmap_1/`, … per frame.
  - Convenient one-shot for smoke tests. For iteration, prefer the split
    A1/A2/A3 packs so you don't re-run Sharp inference every time you
    tweak the render layout.
  - Requires `sharp_repo`; expect 3–30 min depending on `max_frames`.

inputs:
  video_dir:
    tags: [video-source, video-source-array]
    description: "Directory produced by single-video-source (video-source) or video-array-source (video-source-array); the first video file inside is used."

params:
  max_frames:
    type: int
    default: 5
    min: 1
    description: "Cap on frames extracted from the video (--max-frames on video_to_3d.py)."

  n_frames:
    type: int
    default: 5
    min: 1
    description: "How many per-frame COLMAP dirs to export (gsseq_to_multiview --frames)."

  layout:
    type: enum
    values: [horz10, horz6x3_5x2x2]
    default: horz10
    description: "Virtual multi-view camera layout for gsseq_to_multiview."

  width:
    type: int
    default: 1280
  height:
    type: int
    default: 720

  sharp_repo:
    type: string
    description: "Absolute path to the Kiri4DGS repo root on this node (contains sharp-4dgs/)."

outputs:
  colmap_dir:
    tags: [colmap, sharp4dgs_export]
    description: "First-frame COLMAP directory ready to feed stg-train."

runtime:
  env: kiri
  gpu:
    required: true
    vram_gb_min: 8
  expected_duration_min: [3, 30]

exec:
  # Two-step chain: (1) MegaSaM-tracked Sharp-4DGS reconstruction; (2) gsseq_to_multiview
  # produces per-frame COLMAP dirs under WORK/point/colmap_N/. We move colmap_0
  # into the declared output so the next node consumes a clean directory
  # matching its stg-train input contract.
  shell: |
    set -euo pipefail
    cd "{{ params.sharp_repo }}"

    # 1. Locate the video file inside the source dir (any single video extension).
    VIDEO=$(find "{{ inputs.video_dir }}" -maxdepth 1 -type l -o -type f | \
      grep -iE '\.(mp4|mov|avi|mkv)$' | head -1)
    if [ -z "$VIDEO" ]; then
      echo "no video file found under {{ inputs.video_dir }}" >&2
      exit 2
    fi
    VIDEO=$(readlink -f "$VIDEO")
    echo "[ITER 1/3] using video: $VIDEO"

    # Intermediate reconstruction data (MegaSaM + Sharp per-frame + gsseq
    # renders) can easily hit 10+ GiB for a 50-frame video. ``mktemp`` in
    # /tmp silently exhausts the system disk (Phase-0 mono-smoke incident
    # — root fs at 100% caused a no-traceback crash). Use the per-job
    # scratch dir under workspace_root instead; the runtime materialises
    # it for us and keeps it for post-mortem inspection.
    WORK="{{ scratch_dir }}"

    # 2. Sharp-4DGS reconstruction (MegaSaM pose + depth, small frame budget).
    python sharp-4dgs/per-frame/video_to_3d.py "$VIDEO" \
      -o "$WORK/reconstruct" \
      --track_megasam \
      --max-frames {{ params.max_frames }} \
      --rescale-sharp-to-pts \
      --motion-mask-mode depth_p10p90
    echo "[ITER 2/3] reconstruction done"

    # 3. Multi-view export: gsseq_to_multiview builds virtual camera views per
    # frame. Numbering starts at 0 automatically; --frames caps the count.
    EXPORT_ROOT="$WORK/export"
    python sharp-4dgs/per-frame/gsseq_to_multiview.py \
      "$WORK/reconstruct/gaussians_finalized/frame_000000.ply" \
      -o "$EXPORT_ROOT" \
      --layout {{ params.layout }} \
      --frames {{ params.n_frames }} \
      --width {{ params.width }} --height {{ params.height }}
    echo "[ITER 3/3] multi-view export done"

    # 4. Move the per-frame colmap subdirs INTO the declared output dir. STG's
    # dataset reader requires the source path's basename to be colmap_<N>
    # (the starttime index), so we keep those names inside the container
    # rather than flattening. Downstream reads (input dir)/colmap_0.
    OUT="{{ outputs.colmap_dir }}"
    mkdir -p "$OUT"
    for d in "$EXPORT_ROOT"/point/colmap_*; do
      mv "$d" "$OUT/"
    done

idempotency:
  marker: "{{ outputs.colmap_dir }}/.hololab-done"

progress:
  stdout_regex: '\[ITER (\d+)/(\d+)\]'

previews:
  - id: sample_view
    type: image
    glob: "{{ outputs.colmap_dir }}/images/view_*.png"
