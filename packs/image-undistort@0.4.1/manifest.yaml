apiVersion: hololab.dev/v1
kind: Algorithm
name: image-undistort
version: 0.4.1
description: >
  Undistort one frame's images via COLMAP's ``image_undistorter``, using
  a scalar ``colmap-cams`` bundle (from ``colmap-sfm``) as the intrinsic
  source. Bundle-in, bundle-out — outputs a fresh ``colmap-cams``
  (PINHOLE) and the undistorted images.

  Arrayable: fan out one shard per frame of the driving ``images`` input.
  Each shard's ``cams`` output is a PINHOLE ``colmap-cams`` for that
  frame; framework aggregates into ``arrayed<colmap-cams>[frame]``.
source_entry: undistort.py
category: "reconstruction/colmap"

docs: |
  ### v0.4.1 vs v0.4.0

  Thread cap via env vars only. The ``exec.shell`` preamble exports
  ``OMP_NUM_THREADS`` / ``OPENBLAS_NUM_THREADS`` / ``MKL_NUM_THREADS``
  at 2 to pinch Eigen/OpenBLAS/MKL, and ``OMP_THREAD_LIMIT=2`` as a
  hard ceiling that ``omp_set_num_threads()`` cannot override (Ceres +
  a few Eigen paths call it at init and would otherwise re-oversubscribe).
  ``colmap image_undistorter`` has **no** ``--num_threads`` CLI in the
  COLMAP build shipped in the ``kiri`` env, so this env-only cap is the
  best we have without a cgroup / ``taskset`` wrapper. Any residual
  oversubscription comes from non-OMP threading (OpenCV's TBB
  ``parallel_for``, libjpeg's own encode threads), which no COLMAP or
  OMP knob reaches.

  #### Why 2 (fixed)

  Without any cap ``image_undistorter`` defaults to whatever
  ``hardware_concurrency()`` reports (16 on a 16-core box). At
  ``graph_node.parallelism == 8`` (main-chain default) that becomes 8 ×
  16 = 128 concurrent threads sharing 16 cores → CFS churn, cache
  thrashing, load-avg 30+. Cap = ``cores / parallelism`` = 16/8 = **2**
  → 8 shards × ~2 threads = ~16 threads = one per core = tight fit.

  ``parallelism`` isn't exposed to the manifest render context (see
  ``hololab.manifest.render.RenderContext.to_bindings``), so the cap is
  fixed rather than dynamic. If a caller runs this pack at a different
  ``parallelism`` on a differently-sized box, adjust these env vars
  externally. Rule of thumb:
  ``OMP_NUM_THREADS ≈ max(1, nproc // parallelism)``.

  #### Empirical basis

  Measured against the pre-cap ``@0.4.0`` on the main-chain workflow
  (100-shard fanout, ``parallelism=8``, 16-core box):

  * ``@0.4.0`` (no cap): p50 12.0 s, p90 19.6 s, max 39.3 s, total wall
    ≈ 8.6 min, load-avg 26 → 37 (2-2.3× oversubscription).
  * ``@0.4.1`` (env cap + ``OMP_THREAD_LIMIT``): recorded on the
    workflow. Expect small per-shard slowdown when the box is quiet
    (fewer OMP threads per undistort); total wall drops because the
    whole box stops thrashing under fan-out.

  Everything else — the ``image_undistorter`` invocation shape,
  ``model_converter → TXT`` follow-up, NAME rewrite bridge, output
  layout — is unchanged from ``@0.4.0``. Consult ``@0.4.0``'s
  ``docs:`` block for the SfM-cams-direct rationale and the NAME
  rewrite scheme.

arrayable: true

inputs:
  cams:
    tags: [colmap-cams]
    scalar: true
    description: >
      SfM ``colmap-cams`` bundle (cameras.txt OPENCV + images.txt with
      21 poses referencing camera_id=1). Broadcast to every shard.
      Must be a single-camera / OPENCV rig.
  images:
    tags: [image]
    description: >
      Per-frame image directory. Fan-out driver — one shard per element.
      Element dir must contain the per-cam image files inline (regroup
      @0.2.0's ``content_dims=1`` layout).

params:
  blank_pixels:
    type: int
    default: 0
    min: 0
    max: 1
    description: >
      Pass-through to ``image_undistorter --blank_pixels``. 0 (default)
      crops out invalid regions; 1 keeps the original size and fills
      with black.

outputs:
  cams:
    tags: [colmap-cams]
    scalar: true
    dim_labels: ["frame"]
    description: >
      Per-shard PINHOLE ``colmap-cams`` bundle (cameras.txt PINHOLE +
      images.txt with 21 poses). Framework aggregates into
      ``arrayed<colmap-cams>[frame]``. All shards' bundles are
      bit-identical (undistortion is intrinsic-only + poses come from
      the scalar SfM broadcast); the redundancy is the cost of using
      one arrayable pack for the whole per-frame und step.
  images:
    tags: [image]
    scalar: true
    # Per-shard IS the per-cam image dir (21 ``cam_XXXX.png`` files
    # sit directly at the handle root, no ``frames/`` wrapper). Under
    # the arrayable_toggle the framework wraps N shards → aggregate
    # has two dims: outer = per-frame shard dir, inner content = per-cam
    # image file. Handle summary reports ``dim_sizes=[N_frame, N_cam]``.
    # Analogous to ``frame-extraction@0.1.0.frame_sequence``'s
    # ``["cam","frame"]`` with the outer/inner axes swapped.
    dim_labels: ["frame", "cam"]
    description: >
      Per-shard undistorted images, at the PINHOLE resolution. Files
      sit directly under the shard's element dir (post flatten
      migration, no ``frames/`` wrapper).

runtime:
  env: kiri
  gpu:
    required: false

exec:
  shell: |
    set -euo pipefail
    # Cap COLMAP's OpenMP pool. Default is omp_get_max_threads()==nproc,
    # which oversubscribes when the framework fans out N shards in
    # parallel. 2 = cores(16) / parallelism(8). Change if either differs.
    #
    # ``OMP_THREAD_LIMIT`` is a hard ceiling that ``omp_set_num_threads()``
    # cannot exceed — necessary because ``colmap image_undistorter`` has
    # no ``--num_threads`` CLI in this COLMAP build (verified in the
    # ``kiri`` env: only ``feature_extractor`` / ``exhaustive_matcher`` /
    # ``point_triangulator`` expose namespaced ``FeatureExtraction.num_threads``
    # / ``FeatureMatching.num_threads`` / ``Mapper.num_threads``).
    # Without the ceiling a library that calls ``omp_set_num_threads()``
    # at init (Ceres, some Eigen paths) would override ``OMP_NUM_THREADS``
    # and re-oversubscribe.
    export OMP_NUM_THREADS=2
    export OMP_THREAD_LIMIT=2
    export OPENBLAS_NUM_THREADS=2
    export MKL_NUM_THREADS=2
    python "{{ pack_dir }}/undistort.py" \
      --cams "{{ inputs.cams }}" \
      --images "{{ inputs.images }}" \
      --cams-out "{{ outputs.cams }}" \
      --images-out "{{ outputs.images }}" \
      --scratch "{{ scratch_dir }}" \
      --blank-pixels {{ params.blank_pixels }}

idempotency:
  marker: "{{ outputs.cams }}/.hololab-done"
