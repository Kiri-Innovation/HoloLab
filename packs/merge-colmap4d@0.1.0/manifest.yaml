apiVersion: hololab.dev/v1
kind: Algorithm
name: merge-colmap4d
version: 0.1.0
description: "Merge materialized per-group COLMAP reconstructions into one timestamped colmap4d model."
source_entry: merge_colmap4d.py
category: "reconstruction/colmap4d"

docs: |
  Consumes the existing `arrayed[group]<colmap-folder>` reconstruction plus the
  timestamped image groups that created it. The result is one scalar colmap4d:
  all COLMAP ids are globally remapped, every image keeps its independent
  mid-exposure timestamp, and every point receives its track-centroid time.

inputs:
  colmap_frames:
    tags: [colmap-folder]
    arrayed: true
    storage: dir
    dim_labels: [group]
    require_axis_label_match: false  # Also accepts merge-colmap's legacy [frame] axis.
  temporal_groups:
    tags: [image, colmap4d-temporal-groups]
    arrayed: true
    storage: dir
    dim_labels: [group, cam]

outputs:
  model:
    tags: [colmap4d]
    arrayed: false
    storage: dir

requires:
  packages: [colmap4d]
runtime:
  env: kiri
  gpu:
    required: false
  resources:
    scratch_gb: 2.0
    mem_gb: 8.0

exec:
  shell: |
    set -euo pipefail
    python "{{ pack_dir }}/merge_colmap4d.py" \
      --colmap-frames "{{ inputs.colmap_frames }}" \
      --temporal-groups "{{ inputs.temporal_groups }}" \
      --output "{{ outputs.model }}"

idempotency:
  marker: "{{ outputs.model }}/.hololab-done"

progress:
  stdout_regex: '\[ITER (\d+)/(\d+)\]'
