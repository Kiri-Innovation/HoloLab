apiVersion: hololab.dev/v1
kind: Algorithm
name: regroup
version: 0.2.0
description: >
  Generic N-D permutation over a tag-typed arrayed tree. Reorders the
  outer/inner axes of a multi-dim arrayed handle by any permutation of
  its dim labels. Content-dim aware: for ``image`` inputs
  (``content_dims=1``) the innermost dim is enumerated per T-type
  (image files directly under the element dir) rather than as a
  physical subdir layer — which is what the ``frame-extraction`` →
  ``colmap-triangulate`` main chain requires. Legacy ``frames/`` wrapper
  is still consumed on the input side. Successor to
  ``regroup-by-frame@0.1.0``.
source_entry: regroup.py
category: "utility/arrayed"

docs: |
  Reorder the axes of an arrayed<T> handle over any tag-typed leaf T.

  **Params control the permutation + tag semantics.**
  ``input_dims`` / ``output_dims`` name the axes outer-first; both must be
  permutations of the same label set — a typo (``[cam,frame]`` →
  ``[time,cam]``) fails loud at pack start.
  ``content_dims`` says how many of the innermost dims are enumerated
  via the leaf T-type's content rules (default 0 = every dim is a
  physical subdir; 1 = image-style, innermost dim = image files directly
  under the element dir). Matches the framework's tag-driven element
  enumeration in :mod:`hololab.gateway.tag_probes`.

  **Directory + file names.** Physical dir layers use
  ``<dim_label>_<idx:04d>``. The image content layer writes
  ``<parent>/<inner_label>_<idx:04d><ext>`` — one file per innermost
  index, no ``frames/`` wrapper. ``<ext>`` is the source file's
  suffix. Source filename stems are NOT echoed into the target —
  indices come from the sorted position of each element on the source
  side. On the read side both the new flat layout AND the legacy
  ``<leaf>/frames/`` layout are accepted so pre-migration inputs
  continue to regroup cleanly.

  **Symlinks, not copies.** N leaves → N ``os.symlink`` calls to the
  resolved source paths. Idempotent: existing symlinks are unlinked
  first.

  Example — 2-D transpose on ``arrayed<arrayed<colmap>>`` (dirs at both
  levels; ``content_dims=0``):
  ```
  input_dims:   [camera, frame]
  output_dims:  [frame, camera]
  content_dims: 0
  input:  <root>/cam_A/frame_000000/{sparse/,cameras.bin,...}
  output: <root>/frame_0000/camera_0000/ → symlink to source dir
  ```

  Example — 2-D transpose on ``arrayed<arrayed<image>>`` (the main-chain
  ``frame-extraction`` → ``colmap-triangulate`` shape; ``content_dims=1``):
  ```
  input_dims:   [cam, frame]
  output_dims:  [frame, cam]
  content_dims: 1
  input:  <root>/cam00/frame_000000.png       (new layout)
       or <root>/cam00/frames/frame_000000.png (legacy input accepted)
  output: <root>/frame_0000/cam_0000.png       (always new layout — no frames/)
  ```
  Downstream ``colmap-triangulate`` consumes the element dir directly
  (no ``frames/`` subdir). ``cam_key`` derives from the file stem, so
  keys stay consistent between SfM and triangulate.

inputs:
  in:
    tags: [any]
    arrayed: true
    dim_labels: ["", ""]  # 2-D — actual labels come from params.input_dims
    description: "Tag-typed arrayed input tree, outer-first."

outputs:
  out:
    tags: [any]
    arrayed: true
    dim_labels: ["", ""]  # 2-D — actual labels come from params.output_dims
    tags_from: in
    description: >
      Permuted view. Element tags inherit from the wired input via
      ``tags_from``, so the T-type structure is preserved end-to-end.

params:
  input_dims:
    type: "list[str]"
    default: ["cam", "frame"]
    description: >
      Names of the source axes, outer first. Must be a permutation of
      ``output_dims``.
  output_dims:
    type: "list[str]"
    default: ["frame", "cam"]
    description: >
      Desired axes on the target, outer first.
  content_dims:
    type: int
    default: 0
    min: 0
    max: 1
    description: >
      How many of the innermost dims are enumerated via T-type content
      rules (0 = generic dir tree, every axis is a physical subdir; 1 =
      image, innermost axis = image files directly under the element dir
      — legacy ``frames/`` wrapper is still read on input). Set to 1
      when the input carries the ``image`` tag family.

runtime:
  env: kiri
  gpu:
    required: false

exec:
  shell: |
    set -euo pipefail
    python "{{ pack_dir }}/regroup.py" \
      --input "{{ inputs.in }}" \
      --output "{{ outputs.out }}" \
      --input-dims '{{ params.input_dims | tojson }}' \
      --output-dims '{{ params.output_dims | tojson }}' \
      --content-dims {{ params.content_dims }}
