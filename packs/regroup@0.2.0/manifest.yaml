apiVersion: hololab.dev/v1
kind: Algorithm
name: regroup
version: 0.2.0
description: >
  Permute explicit collection axes, retaining either file or directory leaves
  as symlinks. Images are individual files, never implicit content dimensions.
source_entry: regroup.py
category: "basic/array/regroup"

docs: |
  Every input_dims entry describes a directory-container level. The final
  element may be a file (image) or a directory (opaque bundle). output_dims
  must be a permutation of input_dims. Files keep their extensions.

  For image arrays: <root>/<cam>/frame.png becomes
  <out>/frame_0000/cam_0000.png for [cam, frame] -> [frame, cam].
  No extra frames/ directory is inferred or silently unwrapped.

  content_dims remains an accepted job parameter (0 or 1) so current saved
  workflows still render, but it does not alter depth or imply an image
  content axis. File leaves are recognized from their actual storage form.

inputs:
  in:
    tags: [any]
    arrayed: true
    dim_labels: ["", ""]  # 2-D — actual labels come from params.input_dims
    description: "Tag-typed arrayed input tree, outer-first."

outputs:
  out:
    tags: [any]
    arrayed: true
    dim_labels_from: output_dims
    tags_from: in
    description: >
      Permuted view. Element tags inherit from the wired input via
      ``tags_from``, so the T-type structure is preserved end-to-end.

params:
  input_dims:
    type: "list[str]"
    default: ["cam", "frame"]
    description: >
      Names of the source axes, outer first. Must be a permutation of
      ``output_dims``.
  output_dims:
    type: "list[str]"
    default: ["frame", "cam"]
    description: >
      Desired axes on the target, outer first.
  content_dims:
    type: int
    default: 0
    min: 0
    max: 1
    description: "Retained layout hint (0 or 1); does not change collection depth."

runtime:
  env: kiri
  gpu:
    required: false

exec:
  shell: |
    set -euo pipefail
    python "{{ pack_dir }}/regroup.py" \
      --input "{{ inputs.in }}" \
      --output "{{ outputs.out }}" \
      --input-dims '{{ params.input_dims | tojson }}' \
      --output-dims '{{ params.output_dims | tojson }}' \
      --content-dims {{ params.content_dims }}
