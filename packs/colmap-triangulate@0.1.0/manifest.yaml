apiVersion: hololab.dev/v1
kind: Algorithm
name: colmap-triangulate
version: 0.1.0
description: >
  Triangulate 3D points from images + KNOWN camera poses. Consumes a
  ``colmap-cams`` handle (cameras.txt + images.txt) plus a
  ``frame_sequence`` of that frame's images, runs COLMAP
  ``point_triangulator`` with frozen intrinsics, and emits
  ``colmap-points`` (points3D.txt). ``arrayable: true`` — one shard per
  frame when the operator turns the checkbox on.
source_entry: triangulate.py
category: "reconstruction/colmap"

docs: |
  Same underlying primitive as ``rig-group-triangulation`` — both invoke
  ``colmap point_triangulator`` with intrinsics frozen and a reprojection
  filter — but the two packs sit at different points in the workflow:

  | | ``colmap-triangulate`` (this pack) | ``rig-group-triangulation`` |
  |---|---|---|
  | Purpose | **Production** STG pipeline stage | **Experiment** with rig-calibration recipes |
  | Camera pose source | ``colmap-cams`` from an upstream SfM node (per-frame poses that vary over time) | ``rig_extrinsics`` from a solved static rig calibration JSON |
  | Fan-out model | ``arrayable: true`` — framework dispatches one shard per frame | Whole-array in one process with an internal thread pool |
  | Coordinate frame | Whatever the SfM produced (per-frame world) | Static rig frame shared across all groups |

  Both packs stay because they answer different questions ("given
  already-solved poses, materialize the point cloud" vs "how well does
  this candidate rig calibration triangulate?"). The user's product code
  wants the deterministic production wrapper.

  ### Rig-consistency fix (COLMAP 3.11+)

  ``point_triangulator``'s ``Reconstruction::Load(database_cache)`` checks
  ``existing_frame.RigId() == frame.RigId()`` on every frame. Under the
  default one-rig-per-camera / one-frame-per-image convention that reduces
  to *"for each DB ``image_id`` X, the prior's ``image_id`` X must reference
  the same ``camera_id``."* SQLite auto-increments IDs in row-insertion
  order and the extractor's reader threads insert in a non-deterministic
  order, so mechanically copying the SfM's ``cameras.txt`` / ``images.txt``
  into the prior fails on most shards (and even the SfM's own shard, by
  luck alone).

  ``triangulate.py`` follows the same pattern as ``rig_triangulate.py``:
  run ``feature_extractor`` first, query the fresh DB's assigned
  ``(image_id, name, camera_id)``, then synthesise a prior model whose IDs
  are aligned with the DB by construction — intrinsics and poses looked up
  from the SfM output via the per-camera key extracted from the resolved
  image path (grandparent folder in the ``regroup-by-frame`` layout).

  Output layout::

      output/
        points3D.txt

  Downstream (``stg-train`` etc.) reads ``points3D.txt`` alongside the
  original ``cameras.txt``/``images.txt`` from the ``colmap-cams`` handle.

# arrayable=true → the frontend shows the "并行处理数组输入" checkbox;
# when on, the scheduler fans out one shard per element of the arrayed
# inputs (each shard gets one frame's ``cams`` + ``frames`` element).
arrayable: true

inputs:
  cams:
    tags: [colmap-cams]
    description: "Known camera poses (cameras.txt + images.txt) — the SfM output."
  frames:
    tags: [frame_sequence]
    description: "This frame's per-camera images to triangulate against `cams`."

params:
  use_gpu:
    type: int
    default: 1
    min: 0
    max: 1
    description: "1 = CUDA SIFT + matching; 0 = CPU fallback."
  max_image_size:
    type: int
    default: 2400
    min: 512
    description: "SIFT downscale cap."
  max_num_features:
    type: int
    default: 4096
    min: 512
    description: "SIFT feature cap per image."
  filter_max_reproj_error:
    type: float
    default: 4.0
    min: 0.1
    description: "point_triangulator reprojection filter (px)."

outputs:
  points:
    tags: [colmap-points]
    description: "COLMAP text-format points3D.txt (no cameras/images — they came from `cams`)."

runtime:
  env: kiri
  gpu:
    required: false
    vram_gb_min: 2

exec:
  shell: |
    set -euo pipefail
    python "{{ pack_dir }}/triangulate.py" \
      --cams "{{ inputs.cams }}" \
      --image-path "{{ inputs.frames }}/frames" \
      --output "{{ outputs.points }}" \
      --scratch "{{ scratch_dir }}" \
      --use-gpu {{ params.use_gpu }} \
      --max-image-size {{ params.max_image_size }} \
      --max-num-features {{ params.max_num_features }} \
      --filter-max-reproj-error {{ params.filter_max_reproj_error }}

idempotency:
  marker: "{{ outputs.points }}/.hololab-done"
