apiVersion: hololab.dev/v1
kind: Algorithm
name: frame-extraction
version: 0.1.0
description: >
  Extract frames from a video into a directory of ``frame_XXXXXX.png``
  files. Generic utility pack — works with any downstream that consumes
  a ``frame_sequence`` (MegaSaM, other trackers, image-space algorithms).
# Ships WITH HoloLab (colocated with the manifest under hololab/packs/).
# Zero deps on any algorithm repo — only stdlib + cv2 + numpy + tqdm +
# ffmpeg/ffprobe. That's why this lives here and not next to sharp-4dgs.
# ``source_entry`` resolves against the manifest's own directory
# (self-contained + portable).
source_entry: extract_frames.py
category: "source/frames"

# M7 migration: pack is arrayable. When the operator checks "并行处理数组输入"
# on this node, an arrayed<video-source> input (from video-array-source) is
# accepted and the scheduler dispatches one shard per element (per camera).
# Each shard sees a scalar video-source (a directory containing one video)
# — the shell logic is unchanged.
arrayable: true

docs: |
  Frame extractor node. Takes a video and writes ``frame_XXXXXX.png``
  directly into ``<output>/`` (post flatten migration — no ``frames/``
  subdir), plus an ``image``-tagged handle downstream consumers pick up
  automatically.

  - **Input:** ``video_dir`` from ``single-video-source`` (scalar
    ``video-source``) — or ``video-array-source`` (``arrayed<video-source>``)
    when the "并行处理数组输入" checkbox is on. Each shard sees a directory
    containing one video.
  - **Output:** ``image`` — one shard's output IS the ``arrayed<image>``
    sequence (files ``frame_XXXXXX.png`` sit at the handle root, no
    ``frames/`` wrapper). Under arrayable_toggle the aggregate becomes
    ``arrayed<arrayed<image>>`` with ``dim_labels=[cam,frame]`` — outer
    = per-camera shard dir, inner = per-frame file.
  - **Frame selection:** ``start_frame`` / ``end_frame`` define the
    source-index window (half-open ``[start, end)``); ``skip`` is the
    stride *within* that window; ``max_frames`` is an absolute cap on
    the output count. All four mirror the STG ``pre_no_prior`` recipe.
  - **Spatial downsample:** ``max_width`` shrinks wider frames to that
    width preserving aspect ratio (never upscales). 0 = keep native.
  - HDR (HLG / PQ) videos are tonemapped to sRGB automatically.

  Ships with HoloLab (no algorithm repo required). Downstream MegaSaM
  (``frames-to-camera-track``) consumes this handle directly — no
  re-extraction, no video decode.

inputs:
  video_dir:
    tags: [video-source]
    description: "Directory produced by single-video-source or (with arrayed toggle on) one element of video-array-source; the first video file inside is used."

params:
  max_frames:
    type: int
    default: 50
    min: 1
    description: "Cap on extracted frames (--max-frames)."

  skip:
    type: int
    default: 1
    min: 1
    description: "Extract every Nth frame within the [start, end) window."

  max_width:
    type: int
    default: 0
    min: 0
    description: >
      Downscale to this max width in px (aspect-preserved); 0 = keep native
      resolution. Only ever downscales — a video narrower than this passes
      through untouched. Mirrors ``SpacetimeGaussians/script/pre_no_prior.py``
      ``--max_width`` semantics.

  start_frame:
    type: int
    default: 0
    min: 0
    description: >
      Source-frame index (0-based, inclusive) window start. Mirrors STG
      ``--startframe``. Combines with ``skip``: after seeking to ``start_frame``
      we pick every ``skip``-th frame from there.

  end_frame:
    type: int
    default: 0
    min: 0
    description: >
      Source-frame index (0-based, exclusive) window end; 0 = no end, extract
      to video tail. Mirrors STG ``--endframe``. Must be > ``start_frame`` when
      set.

outputs:
  frame_sequence:
    tags: [image]
    # Per-shard the script writes an ``arrayed<image>`` sequence — files
    # ``frame_XXXXXX.png`` sit directly at the handle root (no ``frames/``
    # subdir since the flatten migration). Under arrayable_toggle the
    # framework wraps N shards → ``arrayed<arrayed<image>>``; ``dim_labels``
    # names the aggregate view: outer wrap = per-camera shard dir, inner
    # content = per-frame image file. Handle summary reports
    # ``dim_sizes=[N_cam, N_frame]``.
    dim_labels: ["cam", "frame"]
    description: >
      Directory containing ``frame_XXXXXX.png`` files at its root (no
      ``frames/`` wrapper). Consumed by ``frames-to-camera-track`` and
      any other algorithm that needs an ordered image sequence. Port
      name stays ``frame_sequence`` for wiring stability; the tag is
      the canonical ``image`` (alias-compatible with ``image_sequence`` /
      ``frame_sequence``).

runtime:
  env: kiri
  gpu:
    required: false
  expected_duration_min: [0.05, 2.0]
  resources:
    # Empirical baseline @ 50 frames (720p input):
    #   * scratch ~ 0.5 GiB (extracted PNGs; scales with resolution × count)
    #   * host RAM peak ~ 0.5 GiB (ffmpeg + tqdm)
    #   * GPU not used.
    scratch_gb: 2.0
    mem_gb: 2.0

exec:
  # ``{{ pack_dir }}`` points at hololab/packs/frame-extraction@0.1.0/ —
  # HoloLab-owned packs use pack_dir for their own scripts (algorithm-repo
  # packs use absolute repo paths instead). No ``cd`` needed; the script
  # only touches the input/output paths passed in.
  shell: |
    set -euo pipefail

    VIDEO=$(find "{{ inputs.video_dir }}" -maxdepth 1 -type l -o -type f | \
      grep -iE '\.(mp4|mov|avi|mkv)$' | head -1)
    if [ -z "$VIDEO" ]; then
      echo "no video file found under {{ inputs.video_dir }}" >&2
      exit 2
    fi
    VIDEO=$(readlink -f "$VIDEO")

    OUT="{{ outputs.frame_sequence }}"
    mkdir -p "$OUT"

    python {{ pack_dir }}/extract_frames.py "$VIDEO" \
      --skip {{ params.skip }} \
      --max-frames {{ params.max_frames }} \
      --max-width {{ params.max_width }} \
      --start-frame {{ params.start_frame }} \
      --end-frame {{ params.end_frame }} \
      -o "$OUT"

    # Sanity gate: at least one frame_*.png must sit directly under $OUT.
    if ! ls "$OUT"/frame_*.png >/dev/null 2>&1; then
      echo "no frame_*.png under $OUT" >&2
      exit 4
    fi

idempotency:
  marker: "{{ outputs.frame_sequence }}/.hololab-done"

progress:
  stdout_regex: '\[ITER (\d+)/(\d+)\]'

previews:
  - id: first_frame
    type: image
    path: "{{ outputs.frame_sequence }}/frame_000000.png"
