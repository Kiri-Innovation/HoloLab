apiVersion: hololab.dev/v1
kind: Algorithm
name: col4d/images-add-timestamp
version: 0.1.0
description: images-add-timestamp
source_entry: run.py
inputs:
  images:
    tags:
    - image
    storage: dir
    arrayed: true
    dim_labels:
    - frame
  timestamps:
    storage: dir
    any_of:
    - tags:
      - colmap4d-images
    - tags:
      - colmap4d-timestamps
outputs:
  timed_images:
    tags:
    - colmap4d-images
    storage: dir
requires:
  packages:
  - colmap4d>=1.0.4
  - pillow
runtime:
  env: colmap4d
exec:
  shell: 'python "{{ manifest_dir }}/run.py" <<''CONFIG''

    {{ {''inputs'': inputs, ''outputs'': outputs, ''params'': params} | tojson }}

    CONFIG

    '
