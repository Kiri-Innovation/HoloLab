apiVersion: hololab.dev/v1
kind: Algorithm
name: community/mask-overlay
version: 0.1.0
description: Blend image and mask arrays by position over the whole image.
category: visualization/image
source_entry: run.py
arrayable: true
inputs:
  image:
    tags: [image]
    arrayed: true
    storage: dir
    dim_labels: [frame]
    require_axis_label_match: false
    description: One ordered image group per invocation.
  mask:
    tags: [image]
    arrayed: true
    storage: dir
    dim_labels: [frame]
    require_axis_label_match: false
    description: Equal-length mask group in the same coordinate system; paired by index.
outputs:
  overlay:
    tags: [image]
    arrayed: true
    storage: dir
    dim_labels: [frame]
params:
  alpha:
    type: float
    default: 0.5
    min: 0.0
    max: 1.0
    description: Mask weight; output = (1-alpha)*image + alpha*mask_rgb everywhere.
runtime:
  env: cam3
  gpu: {required: false}
  resources: {scratch_gb: 0.1, mem_gb: 0.5}
exec:
  shell: >-
    python "{{ pack_dir }}/run.py" --image "{{ inputs.image }}"
    --mask "{{ inputs.mask }}" --output "{{ outputs.overlay }}"
    --alpha "{{ params.alpha }}"
idempotency:
  marker: '{{ outputs.overlay }}/.hololab-done'
progress:
  stdout_regex: '\[ITER (\d+)/(\d+)\]'
previews:
  - id: first_overlay
    type: image
    path: '{{ outputs.overlay }}/p_0000000000000000.png'
